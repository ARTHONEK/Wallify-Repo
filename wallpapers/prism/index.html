<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>prism</title><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#08070e;display:block}canvas{position:fixed;inset:0}</style></head><body><canvas id="prism"></canvas><script>
(()=>{'use strict';
const canvas=document.getElementById('prism'),ctx=canvas.getContext('2d',{alpha:false});let W=0,H=0,dpr=1,last=0,paused=false,time=0,started=false,points=[],triangles=[];
let C={weight:145,style:'iridescent',color:'#ffffff',shift:70,seed:'72419',sourceX:67,sourceY:48,motion:'orbit',speed:.16};
const eng=()=>window.WallpaperEngine;const get=(k,d)=>eng()?eng().getSetting(k,d):d;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function read(){C.weight=clamp(+get('weight','145'),0,500);C.style=get('lightStyle','iridescent');C.color=get('lightColor','#ffffff');C.shift=clamp(+get('shift','70'),0,100);C.seed=String(get('seed','72419')).replace(/\D/g,'').slice(0,5)||'72419';C.sourceX=clamp(+get('sourceX','67'),0,100);C.sourceY=clamp(+get('sourceY','48'),0,100);C.motion=get('motion','orbit');C.speed=({still:0,slow:.07,normal:.16,fast:.34})[get('speed','normal')]??.16;mesh()}
function random(seed){let s=(+seed||72419)>>>0;return()=>((s=(s*1664525+1013904223)>>>0)/4294967296)}
function mesh(){const r=random(C.seed),cols=5,rows=10;points=[];for(let y=0;y<=rows;y++)for(let x=0;x<=cols;x++){let px=x/cols*W,py=y/rows*H;if(x>0&&x<cols)px+=(r()-.5)*W*.20;if(y>0&&y<rows)py+=(r()-.5)*H*.11;points.push([px,py])}triangles=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let a=y*(cols+1)+x,b=a+1,c=a+cols+1,d=c+1;if(r()>.5)triangles.push([a,b,d,r()],[a,d,c,r()]);else triangles.push([a,b,c,r()],[b,d,c,r()])}}
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);mesh()}
function hex(h,a){let n=parseInt(h.slice(1),16)||0;return`rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
function poly(a,b,c){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.closePath()}
function draw(now){if(paused)return;const dt=Math.min((now-last||16)/1000,.05);last=now;time+=dt*C.speed;let sx=W*C.sourceX/100,sy=H*C.sourceY/100;if(C.motion==='orbit'){sx+=Math.cos(time*2.1)*W*.18;sy+=Math.sin(time*1.65)*H*.14}else if(C.motion==='drift'){sx+=Math.sin(time*.9)*W*.32;sy+=Math.cos(time*.7)*H*.24}else if(C.motion==='pulse'){sx+=Math.sin(time*3)*W*.06;sy+=Math.cos(time*2.4)*H*.06}let bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#14101e');bg.addColorStop(.48,'#070813');bg.addColorStop(1,'#120d20');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);const disto=C.shift/100,thick=C.weight/500;for(let i=0;i<triangles.length;i++){let t=triangles[i],a=points[t[0]],b=points[t[1]],c=points[t[2]],cx=(a[0]+b[0]+c[0])/3,cy=(a[1]+b[1]+c[1])/3,near=1-clamp(Math.hypot(cx-sx,cy-sy)/Math.max(W,H),0,1),hue=(Math.atan2(cy-sy,cx-sx)*180/Math.PI+360+i*61+time*95)%360;poly(a,b,c);let g=ctx.createLinearGradient(a[0],a[1],c[0],c[1]);if(C.style==='mono'){g.addColorStop(0,hex(C.color,.18+near*.68));g.addColorStop(1,'rgba(8,7,19,.72)')}else{g.addColorStop(0,`hsla(${hue},${65+disto*35}%,${35+near*45}%,.92)`);g.addColorStop(.5,`hsla(${(hue+110+disto*90)%360},100%,${42+near*43}%,.88)`);g.addColorStop(1,`hsla(${(hue+220)%360},85%,${20+near*38}%,.9)`)}ctx.fillStyle=g;ctx.fill();ctx.save();ctx.clip();ctx.globalCompositeOperation='screen';for(let k=-2;k<4;k++){let band=ctx.createLinearGradient(sx+k*W*.12,sy-H*.22,sx+(k+1)*W*.15,sy+H*.32);band.addColorStop(0,'rgba(255,0,170,0)');band.addColorStop(.4,`hsla(${(hue+k*72)%360},100%,70%,${near*.42*disto})`);band.addColorStop(.57,`hsla(${(hue+k*72+85)%360},100%,72%,${near*.48*disto})`);band.addColorStop(1,'rgba(0,255,255,0)');ctx.fillStyle=band;ctx.fillRect(0,0,W,H)}ctx.restore();poly(a,b,c);ctx.strokeStyle=`rgba(235,242,255,${.08+thick*.35})`;ctx.lineWidth=.4+thick*2.1;ctx.stroke()}let glow=ctx.createRadialGradient(sx,sy,0,sx,sy,Math.max(W,H)*.5);glow.addColorStop(0,C.style==='mono'?hex(C.color,.28+thick*.4):`hsla(${(time*105)%360},100%,76%,${.16+thick*.3})`);glow.addColorStop(1,'rgba(0,0,0,0)');ctx.globalCompositeOperation='screen';ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';requestAnimationFrame(draw)}
function start(){if(!started){started=true;last=performance.now();requestAnimationFrame(draw)}}window.addEventListener('wallpaperEngineReady',()=>{read();resize();start()});window.addEventListener('wallpaperUpdate',read);window.addEventListener('wallpaperPause',()=>paused=true);window.addEventListener('wallpaperResume',()=>{if(paused){paused=false;last=performance.now();requestAnimationFrame(draw)}});window.addEventListener('resize',resize);window.triggerAnimation=()=>{time=0};resize();start();
})();
</script></body></html>
