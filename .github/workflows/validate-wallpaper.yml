name: Validate Wallpaper PR

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Allow only wallpaper folders in PR
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate_pr_paths.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Validate catalog and bundles
        run: |
          python3 scripts/generate_index.py
          python3 scripts/validate_catalog.py
