<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки Material 3 Shapes</title>
    <style>
        :root {
            --accent-primary: #6750A4;
            --accent-secondary: #625B71;
            --bg-color: #141218;
            --card-bg: rgba(255, 255, 255, 0.06);
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            transition: background-color 0.4s ease;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        h2 {
            color: var(--accent-primary);
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .setting-group {
            margin-bottom: 16px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.35);
            color: #ffffff;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        select:focus {
            border-color: var(--accent-primary);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 16px;
            background: var(--accent-primary);
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Настройки Material 3 Shapes</h2>

        <div class="setting-group">
            <label for="speed">Скорость движения</label>
            <select id="speed">
                <option value="slow">Медленная (Режим энергосбережения)</option>
                <option value="normal" selected>Стандартная (Плавная)</option>
                <option value="fast">Динамичная (Высокая скорость)</option>
            </select>
        </div>

        <div class="setting-group">
            <label for="shapeCount">Количество фигур на экране</label>
            <select id="shapeCount">
                <option value="4">4 фигуры (Минимализм)</option>
                <option value="6" selected>6 фигур (Стандарт)</option>
                <option value="8">8 фигур (Насыщенно)</option>
                <option value="12">12 фигур (Максимум)</option>
            </select>
        </div>

        <button id="saveBtn">Сохранить настройки</button>
    </div>

    <script>
        function applyMonetColors(metadata) {
            if (metadata && metadata.accentColors) {
                document.documentElement.style.setProperty('--accent-primary', metadata.accentColors.primary);
                document.documentElement.style.setProperty('--accent-secondary', metadata.accentColors.secondary);
                document.documentElement.style.setProperty('--bg-color', metadata.accentColors.background);
            }
        }

        function loadSavedValues() {
            if (window.WallpaperEngine && window.WallpaperEngine.getSetting) {
                applyMonetColors(window.WallpaperEngine.getMetadata());

                const savedSpeed = window.WallpaperEngine.getSetting('speed', 'normal');
                const savedCount = window.WallpaperEngine.getSetting('shapeCount', '6');

                const speedEl = document.getElementById('speed');
                const countEl = document.getElementById('shapeCount');

                if (speedEl && savedSpeed) speedEl.value = savedSpeed;
                if (countEl && savedCount) countEl.value = savedCount;
            }
        }

        window.addEventListener('wallpaperUpdate', (e) => {
            applyMonetColors(e.detail);
            loadSavedValues();
        });

        window.addEventListener('wallpaperEngineReady', () => {
            loadSavedValues();
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadSavedValues();
            setTimeout(loadSavedValues, 150);

            document.getElementById('saveBtn').addEventListener('click', () => {
                const speed = document.getElementById('speed').value;
                const count = document.getElementById('shapeCount').value;

                if (window.WallpaperEngine && window.WallpaperEngine.saveSetting) {
                    window.WallpaperEngine.saveSetting('speed', speed);
                    window.WallpaperEngine.saveSetting('shapeCount', count);
                    alert('Настройки обоев сохранены!');
                }
            });
        });
    </script>
</body>
</html>
