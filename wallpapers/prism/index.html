<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>prism</title><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#101018;display:block}canvas{position:fixed;inset:0}</style></head><body><canvas id="prism"></canvas><script>
(()=>{'use strict';
const canvas=document.getElementById('prism'),ctx=canvas.getContext('2d',{alpha:false}),image=new Image();image.src='prism.jpg';let W=0,H=0,dpr=1,last=0,paused=false,time=0,started=false,points=[],triangles=[];
let C={weight:145,style:'iridescent',color:'#ffffff',shift:70,seed:'72419',sourceX:67,sourceY:48,motion:'orbit',speed:.16};
const eng=()=>window.WallpaperEngine;const get=(k,d)=>eng()?eng().getSetting(k,d):d;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function read(){C.weight=clamp(+get('weight','145'),0,500);C.style=get('lightStyle','iridescent');C.color=get('lightColor','#ffffff');C.shift=clamp(+get('shift','70'),0,100);C.seed=String(get('seed','72419')).replace(/\D/g,'').slice(0,5)||'72419';C.sourceX=clamp(+get('sourceX','67'),0,100);C.sourceY=clamp(+get('sourceY','48'),0,100);C.motion=get('motion','orbit');C.speed=({still:0,slow:.07,normal:.16,fast:.34})[get('speed','normal')]??.16;buildMesh()}
function rng(seed){let state=(+seed||72419)>>>0;return()=>((state=(state*1664525+1013904223)>>>0)/4294967296)}
function buildMesh(){const r=rng(C.seed),cols=5,rows=8;points=[];for(let y=0;y<=rows;y++)for(let x=0;x<=cols;x++){let px=x/cols*W,py=y/rows*H;if(x>0&&x<cols)px+=(r()-.5)*W*.14;if(y>0&&y<rows)py+=(r()-.5)*H*.08;points.push([px,py])}triangles=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let a=y*(cols+1)+x,b=a+1,c=a+cols+1,d=c+1;if(r()>.5)triangles.push([a,b,d],[a,d,c]);else triangles.push([a,b,c],[b,d,c])}}
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);buildMesh()}
function cover(){const s=Math.max(W/image.width,H/image.height),w=image.width*s,h=image.height*s;ctx.drawImage(image,(W-w)/2,(H-h)/2,w,h)}
function hex(hex,a){let n=parseInt(hex.slice(1),16)||0;return`rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
function draw(now){if(paused)return;const dt=Math.min((now-last||16)/1000,.05);last=now;time+=dt*C.speed;if(!image.complete){requestAnimationFrame(draw);return}cover();let x=W*C.sourceX/100,y=H*C.sourceY/100;if(C.motion==='orbit'){x+=Math.cos(time*2.1)*W*.18;y+=Math.sin(time*1.65)*H*.14}else if(C.motion==='drift'){x+=Math.sin(time*.9)*W*.32;y+=Math.cos(time*.7)*H*.24}else if(C.motion==='pulse'){x+=Math.sin(time*3)*W*.06;y+=Math.cos(time*2.4)*H*.06}const amount=C.shift/100,alpha=(C.weight/500)*.72;ctx.save();ctx.globalCompositeOperation=C.style==='neon'?'screen':C.style==='soft'?'soft-light':'overlay';for(let i=0;i<triangles.length;i++){let t=triangles[i],a=points[t[0]],b=points[t[1]],c=points[t[2]],cx=(a[0]+b[0]+c[0])/3,cy=(a[1]+b[1]+c[1])/3,dist=Math.hypot(cx-x,cy-y)/Math.max(W,H),glow=Math.max(0,1-dist*1.8)*alpha;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.closePath();let hue=(Math.atan2(cy-y,cx-x)*180/Math.PI+360+(i*47)+time*90)%360;ctx.fillStyle=C.style==='mono'?hex(C.color,glow):`hsla(${hue},${60+amount*40}%,${48+amount*24}%,${glow})`;ctx.fill();if(C.weight>80){ctx.strokeStyle=hex('#ffffff',Math.min(.32,glow*.35));ctx.lineWidth=Math.max(.35,C.weight/350);ctx.stroke()}}ctx.restore();let g=ctx.createRadialGradient(x,y,0,x,y,Math.max(W,H)*.42);g.addColorStop(0,C.style==='mono'?hex(C.color,alpha*.45):`hsla(${(time*100)%360},100%,76%,${alpha*.42})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalCompositeOperation='screen';ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';requestAnimationFrame(draw)}
function start(){if(!started){started=true;last=performance.now();requestAnimationFrame(draw)}}window.addEventListener('wallpaperEngineReady',()=>{read();resize();start()});window.addEventListener('wallpaperUpdate',read);window.addEventListener('wallpaperPause',()=>paused=true);window.addEventListener('wallpaperResume',()=>{if(paused){paused=false;last=performance.now();requestAnimationFrame(draw)}});window.triggerAnimation=()=>{time=0};window.addEventListener('resize',resize);resize();start();
})();
</script></body></html>
