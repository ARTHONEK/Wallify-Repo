<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Flow — настройки</title>
<!-- Для локального тестирования на ПК (в приложении эти стили инжектятся автоматически) -->
<link rel="stylesheet" href="wallify-m3.css">
<style>
  body {
    margin: 0;
    padding: 20px 16px 48px;
    background: var(--wallify-m3-background, #141218);
    color: var(--wallify-m3-on-surface, #e6e1e5);
    font-family: "Roboto", system-ui, -apple-system, sans-serif;
  }

  h1 {
    font-size: 22px;
    line-height: 28px;
    font-weight: 500;
    margin: 4px 0 2px;
  }

  .sub {
    font-size: 13px;
    color: var(--wallify-m3-on-surface-variant, #cac4d0);
    margin: 0 0 24px;
  }

  .section-title {
    font-size: 12px;
    line-height: 16px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--wallify-m3-primary);
    margin: 0 4px 8px;
  }

  .value-pill {
    font-size: 14px;
    font-weight: 500;
    color: var(--wallify-m3-primary);
    float: right;
  }

  /* Segmented control for Speed */
  .segmented {
    display: flex;
    gap: 4px;
    background: color-mix(in srgb, var(--wallify-m3-on-surface, #e6e1e5) 8%, transparent);
    border-radius: 999px;
    padding: 4px;
    margin-top: 12px;
    width: 100%;
  }

  .segmented button {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--wallify-m3-on-surface-variant, #cac4d0);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .segmented button.active {
    background: var(--wallify-m3-primary);
    color: var(--wallify-m3-on-primary);
  }
</style>
</head>
<body>
  <h1>Material Flow</h1>
  <p class="sub">Настройки живых обоев</p>

  <!-- Группа 1: Форма -->
  <p class="section-title">Форма</p>
  <div data-wallify-m3="card-group">
    <section data-wallify-m3="card">
      <div class="row-content" style="gap: 8px;">
        <div class="row-title">Количество фигур <span class="value-pill" id="countValue">6</span></div>
        <input id="count" type="range" min="2" max="20" step="1" value="6" data-wallify-m3="slider">
      </div>
    </section>
  </div>

  <!-- Группа 2: Движение -->
  <p class="section-title" style="margin-top: 24px;">Движение</p>
  <div data-wallify-m3="card-group">
    <section data-wallify-m3="card">
      <div class="row-content" style="gap: 4px;">
        <div class="row-title">Скорость</div>
        <div class="segmented" id="speedSeg">
          <button type="button" data-v="slow">Медленно</button>
          <button type="button" data-v="normal">Обычно</button>
          <button type="button" data-v="fast">Быстро</button>
        </div>
      </div>
    </section>
  </div>

  <!-- Группа 3: Внешний вид -->
  <p class="section-title" style="margin-top: 24px;">Внешний вид</p>
  <div data-wallify-m3="card-group">
    <section data-wallify-m3="card">
      <div class="row">
        <div class="row-content">
          <div class="row-title">Свечение</div>
          <div class="row-desc">Мягкое сияние вокруг фигур</div>
        </div>
        <input type="checkbox" id="glow" data-wallify-m3="switch">
      </div>
    </section>

    <section data-wallify-m3="card">
      <div class="row">
        <div class="row-content">
          <div class="row-title">Частицы</div>
          <div class="row-desc">Плывущие вверх искры на фоне</div>
        </div>
        <input type="checkbox" id="particles" data-wallify-m3="switch">
      </div>
    </section>

    <section data-wallify-m3="card">
      <div class="row-content" style="gap: 8px;">
        <div class="row-title">Затемнение фона <span class="value-pill" id="dimValue">0%</span></div>
        <input id="dim" type="range" min="0" max="1" step="0.05" value="0" data-wallify-m3="slider">
      </div>
    </section>
  </div>

  <!-- Для локального тестирования на ПК (в приложении скрипт инжектится автоматически) -->
  <script src="wallify-m3.js"></script>
  <script>
  (function () {
    function init(engine, meta) {
      const count = document.getElementById('count');
      const countValue = document.getElementById('countValue');
      const dim = document.getElementById('dim');
      const dimValue = document.getElementById('dimValue');
      const glow = document.getElementById('glow');
      const particles = document.getElementById('particles');

      // Инициализируем ползунок количества
      count.value = engine.getSetting('shapeCount', '6');
      countValue.textContent = count.value;
      // Триггерим обновление кастомного слайдера UI Kit
      count.dispatchEvent(new Event('input'));

      count.addEventListener('input', () => {
        countValue.textContent = count.value;
        engine.saveSetting('shapeCount', count.value);
      });

      const speedSeg = document.getElementById('speedSeg');
      const setSpeedActive = (value) => {
        [...speedSeg.children].forEach(btn => {
          btn.classList.toggle('active', btn.dataset.v === value);
        });
      };
      setSpeedActive(engine.getSetting('speed', 'normal'));
      [...speedSeg.children].forEach(btn => {
        btn.addEventListener('click', () => {
          engine.saveSetting('speed', btn.dataset.v);
          setSpeedActive(btn.dataset.v);
        });
      });

      const wireSwitch = (el, key, def) => {
        el.checked = engine.getSetting(key, def ? 'true' : 'false') === 'true';
        el.dispatchEvent(new Event('change')); // Обновляем свитч в UI Kit
        el.addEventListener('change', () => {
          engine.saveSetting(key, el.checked ? 'true' : 'false');
        });
      };
      wireSwitch(glow, 'glow', true);
      wireSwitch(particles, 'particles', true);

      // Инициализируем ползунок затемнения
      dim.value = engine.getSetting('bgDim', '0');
      dimValue.textContent = Math.round(parseFloat(dim.value || '0') * 100) + '%';
      dim.dispatchEvent(new Event('input')); // Обновляем слайдер в UI Kit

      dim.addEventListener('input', () => {
        dimValue.textContent = Math.round(parseFloat(dim.value || '0') * 100) + '%';
        engine.saveSetting('bgDim', dim.value);
      });
    }

    window.addEventListener('wallpaperEngineReady', (e) => {
      if (window.WallpaperEngine) init(window.WallpaperEngine, e.detail);
    }, { once: true });
  })();
  </script>
</body>
</html>
