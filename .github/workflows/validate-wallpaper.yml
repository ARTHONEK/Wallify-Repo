name: Validate Wallpaper PR

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Validate JSON & Manifest Files
        run: |
          echo "Checking index.json format..."
          node -e "JSON.parse(require('fs').readFileSync('index.json', 'utf8'))"
          echo "Validation complete!"
