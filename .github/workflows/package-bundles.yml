name: Package Bundles

# Собирает каждый комплект в ZIP и обновляет постоянный релиз `bundles`.
# Ссылки на архивы стабильны и указаны в index.json как downloadUrl:
#   https://github.com/<owner>/<repo>/releases/download/bundles/<id>.zip
#
# Без этого архива приложение забирает из репозитория только точку входа и
# manifest.json — комплекты со страницей настроек, обложкой и ассетами приедут
# на устройство неполными.

on:
  push:
    branches: [ main ]
    paths:
      - 'wallpapers/**'
      - 'scripts/generate_index.py'
      - 'scripts/validate_catalog.py'
      - '.github/workflows/package-bundles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    if: github.repository == 'YouRooni/Wallify-Repo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate catalog index
        run: python3 scripts/generate_index.py

      - name: Validate before packaging
        run: python3 scripts/validate_catalog.py

      - name: Commit generated index
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json уже актуален"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: обновить каталог обоев"
          git push

      - name: Build changed bundles
        id: bundles
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mapfile -t ids < <(find wallpapers -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          else
            mapfile -t ids < <(
              git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- wallpapers/ |
              awk -F/ 'NF >= 2 {print $2}' |
              sort -u
            )
          fi
          for id in "${ids[@]}"; do
            dir="wallpapers/$id"
            if [[ ! -d "$dir" ]]; then
              echo "$id.zip" >> dist/deleted-assets.txt
              echo "будет удалён $id.zip"
              continue
            fi
            # Файлы кладём в корень архива — так их ждёт установщик.
            (cd "$dir" && zip -r -q "$GITHUB_WORKSPACE/dist/$id.zip" . -x '.*')
            echo "собран dist/$id.zip"
          done
          ls -lh dist
          if compgen -G "dist/*.zip" >/dev/null || [[ -s dist/deleted-assets.txt ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish rolling release
        if: steps.bundles.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view bundles >/dev/null 2>&1; then
            gh release create bundles \
              --title "Wallpaper bundles" \
              --notes "Архивы комплектов, пересобираются автоматически при каждом изменении в wallpapers/. Ссылки в этом релизе постоянны и используются как downloadUrl в index.json."
          fi
          if [[ -s dist/deleted-assets.txt ]]; then
            while IFS= read -r asset; do
              gh release delete-asset bundles "$asset" --yes || echo "$asset уже отсутствует"
            done < dist/deleted-assets.txt
          fi
          if compgen -G "dist/*.zip" >/dev/null; then
            gh release upload bundles dist/*.zip --clobber
          fi
