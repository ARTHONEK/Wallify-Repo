<!DOCTYPE html>

<html lang="ru">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Battery Fill — настройки</title>

  <!--
    Подключения нужны только
    для тестирования на ПК.

    В приложении Wallify
    UI Kit добавляется автоматически.
  -->

  <link
    rel="stylesheet"
    href="wallify-m3.css"
  >

  <style>

    /*
      Основная страница.
    */

    body {
      margin: 0;

      padding:
        20px
        16px
        48px;

      background:
        var(
          --wallify-m3-background,
          #141218
        );

      color:
        var(
          --wallify-m3-on-surface,
          #e6e1e5
        );

      font-family:
        "Roboto",
        system-ui,
        -apple-system,
        sans-serif;
    }


    /*
      Заголовок.
    */

    h1 {
      margin:
        4px
        0
        2px;

      font-size:
        22px;

      line-height:
        28px;

      font-weight:
        500;
    }


    /*
      Описание.
    */

    .sub {
      margin:
        0
        0
        24px;

      font-size:
        13px;

      line-height:
        18px;

      color:
        var(
          --wallify-m3-on-surface-variant,
          #cac4d0
        );
    }


    /*
      Заголовок группы.
    */

    .section-title {
      margin:
        24px
        4px
        8px;

      font-size:
        12px;

      line-height:
        16px;

      font-weight:
        500;

      letter-spacing:
        0.08em;

      text-transform:
        uppercase;

      color:
        var(
          --wallify-m3-primary,
          #d0bcff
        );
    }


    /*
      Первая группа.
    */

    .section-title.first {
      margin-top:
        0;
    }


    /*
      Карточка пользовательского
      цвета.
    */

    .color-card {
      transition:
        opacity
        220ms ease;
    }


    /*
      Material You включён.

      Цвет можно увидеть,
      но изменить нельзя.
    */

    .color-card.disabled {
      opacity:
        0.45;

      pointer-events:
        none;
    }


    /*
      Название настройки цвета.
    */

    .color-label {
      display:
        block;

      margin-bottom:
        12px;

      font-size:
        16px;

      line-height:
        22px;

      font-weight:
        500;

      color:
        var(
          --wallify-m3-on-surface,
          #e6e1e5
        );
    }


    /*
      Строка с выбором цвета.
    */

    .color-row {
      display:
        flex;

      align-items:
        center;

      gap:
        14px;
    }


    /*
      Поле выбора цвета.
    */

    input[type="color"] {
      flex:
        0 0 auto;

      width:
        52px;

      height:
        44px;

      padding:
        3px;

      border:
        1px solid
        var(
          --wallify-m3-outline,
          #938f99
        );

      border-radius:
        12px;

      background:
        transparent;

      cursor:
        pointer;
    }


    /*
      HEX-значение.
    */

    .color-value {
      color:
        var(
          --wallify-m3-primary,
          #d0bcff
        );

      font-family:
        ui-monospace,
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size:
        15px;

      font-weight:
        500;

      letter-spacing:
        0.04em;
    }


    /*
      Подсказка.
    */

    .note {
      margin:
        12px
        0
        0;

      font-size:
        13px;

      line-height:
        18px;

      color:
        var(
          --wallify-m3-on-surface-variant,
          #cac4d0
        );
    }

  </style>

</head>

<body>

  <!--
    Название обоев.
  -->

  <h1>
    Battery Fill
  </h1>

  <p class="sub">
    Настройка цвета
    и палитры обоев
  </p>

  <!--
    Группа:
    Цветовая палитра.
  -->

  <p
    class="
      section-title
      first
    "
  >
    Цветовая палитра
  </p>

  <div
    data-wallify-m3="card-group"
  >


<!--
  Material You.
-->

<section
  data-wallify-m3="card"
>

  <div class="row">


    <div class="row-content">


      <div class="row-title">

        Material You

      </div>


      <div class="row-desc">

        Использовать системные
        цвета Android

      </div>


    </div>


    <input
      id="materialYou"

      type="checkbox"

      data-wallify-m3="switch"
    >


  </div>

</section>


  </div>

  <!--
    Группа:
    Пользовательский цвет.
  -->

  <p class="section-title">


Пользовательский цвет


  </p>

  <div
    id="colorCard"


class="color-card"

data-wallify-m3="card-group"


>


<section
  data-wallify-m3="card"
>


  <div class="row-content">


    <label
      class="color-label"

      for="fillColor"
    >

      Цвет заполнения

    </label>



    <div class="color-row">


      <input
        id="fillColor"

        type="color"

        value="#5f8f72"
      >


      <span
        id="colorValue"

        class="color-value"
      >

        #5F8F72

      </span>


    </div>



    <p class="note">

      Используется,
      когда Material You выключен.

    </p>


  </div>


</section>


  </div>

  <!--
    Только для локального
    тестирования.

    В Wallify UI Kit
    подключается автоматически.
  -->

  <script
    src="wallify-m3.js"
  ></script>

  <script>

    (
      function ()
      {


        /*
          Получаем элементы.
        */

        const materialYou =

          document.getElementById(
            'materialYou'
          );


        const fillColor =

          document.getElementById(
            'fillColor'
          );


        const colorValue =

          document.getElementById(
            'colorValue'
          );


        const colorCard =

          document.getElementById(
            'colorCard'
          );



        /*
          Получение API.
        */

        function getEngine()
        {

          return (

            window.WallpaperEngine

            ||

            null

          );

        }



        /*
          Сохранение настройки.

          В браузере используется
          localStorage.
        */

        function saveSetting(

          key,

          value

        )
        {


          const engine =

            getEngine();



          if (
            engine
          )
          {

            engine.saveSetting(

              key,

              String(value)

            );

          }


          else
          {

            localStorage.setItem(

              key,

              String(value)

            );

          }


        }



        /*
          Получение настройки.
        */

        function getSetting(

          key,

          fallback

        )
        {


          const engine =

            getEngine();



          if (
            engine
          )
          {

            return (

              engine.getSetting(

                key,

                String(fallback)

              )

            );

          }



          return (

            localStorage.getItem(
              key
            )

            ||

            String(
              fallback
            )

          );


        }



        /*
          Обновление
          HEX-значения.
        */

        function updateColorText()
        {

          colorValue.textContent =

            fillColor
              .value
              .toUpperCase();

        }



        /*
          Блокировка карточки.

          Если Material You
          включён, ручной цвет
          недоступен.
        */

        function updateDisabledState()
        {

          colorCard
            .classList
            .toggle(

              'disabled',

              materialYou.checked

            );

        }



        /*
          Загрузка настроек.
        */

        function loadSettings()
        {


          /*
            Material You.
          */

          materialYou.checked =

            getSetting(

              'materialYou',

              'true'

            )

            ===

            'true';



          /*
            Цвет заполнения.
          */

          fillColor.value =

            getSetting(

              'fillColor',

              '#5f8f72'

            );



          /*
            Обновляем
            M3-переключатель.
          */

          materialYou.dispatchEvent(

            new Event(
              'change'
            )

          );



          updateColorText();


          updateDisabledState();


        }



        /*
          Изменение Material You.
        */

        materialYou.addEventListener(

          'change',

          () =>
          {


            saveSetting(

              'materialYou',

              materialYou.checked

            );


            updateDisabledState();


          }

        );



        /*
          Изменение цвета.
        */

        fillColor.addEventListener(

          'input',

          () =>
          {


            updateColorText();


            saveSetting(

              'fillColor',

              fillColor.value

            );


          }

        );



        /*
          Wallify передал API.
        */

        window.addEventListener(

          'wallpaperEngineReady',

          () =>
          {

            loadSettings();

          },

          {
            once:
              true
          }

        );



        /*
          Запуск при открытии
          в обычном браузере.
        */

        if (
          !window.WallpaperEngine
        )
        {

          document.addEventListener(

            'DOMContentLoaded',

            loadSettings,

            {
              once:
                true
            }

          );

        }


      }
    )();

  </script>

</body>

</html>
