<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="docTitle">Settings</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap');

        body {
            font-family: 'Google Sans', 'Product Sans', 'Roboto', system-ui, -apple-system, sans-serif;
            background-color: #141218;
            color: #E6E1E5;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-title {
            font-size: 32px;
            font-weight: 400;
            margin: 24px 8px 16px 8px;
            letter-spacing: 0px;
        }

        .setting-card {
            background-color: #211F26;
            border-radius: 28px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label {
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .value-badge {
            font-size: 14px;
            color: #D0BCFF;
            font-weight: 500;
            background: #332D41;
            padding: 6px 16px;
            border-radius: 16px;
            letter-spacing: 0.1px;
        }

        input[type="range"] {
            width: 100%;
            margin: 0;
            accent-color: #D0BCFF;
            height: 4px;
            background: #4A4458;
            border-radius: 2px;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #D0BCFF;
            cursor: pointer;
        }

        .switch-container {
            flex-direction: row;
            padding: 20px 24px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 32px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: transparent;
            border-radius: 32px;
            border: 2px solid #938F99;
            box-sizing: border-box;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 6px;
            bottom: 6px;
            background-color: #938F99;
            border-radius: 50%;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
        }

        input:checked + .slider {
            background-color: #D0BCFF;
            border-color: #D0BCFF;
        }

        input:checked + .slider:before {
            background-color: #381E72;
            height: 24px;
            width: 24px;
            left: 22px;
            bottom: 2px;
        }
    </style>
</head>
<body>
    <div class="header-title" id="titleText">Settings</div>

    <div class="setting-card">
        <div class="setting-row">
            <span class="label" id="sizeLabel">Shapes size</span>
            <span class="value-badge" id="sizeValue">1.0x</span>
        </div>
        <input id="size" type="range" min="0.5" max="2.5" step="0.1" value="1.0">
    </div>

    <div class="setting-card switch-container setting-row">
        <span class="label" id="collisionLabel">Shapes collision</span>
        <label class="switch">
            <input id="collision" type="checkbox">
            <span class="slider"></span>
        </label>
    </div>

    <div class="setting-card switch-container setting-row">
        <span class="label" id="amoledLabel">AMOLED mode</span>
        <label class="switch">
            <input id="amoled" type="checkbox">
            <span class="slider"></span>
        </label>
    </div>

    <script>
        const translations = {
            en: {
                docTitle: "Wallpaper Settings",
                titleText: "Settings",
                sizeLabel: "Shapes size",
                collisionLabel: "Shapes collision",
                amoledLabel: "AMOLED mode (pure black)"
            },
            ru: {
                docTitle: "Настройки обоев",
                titleText: "Настройки",
                sizeLabel: "Размер фигур",
                collisionLabel: "Столкновения фигур",
                amoledLabel: "Режим AMOLED (глубокий чёрный)"
            }
        };

        const sysLang = navigator.language.slice(0, 2);
        const lang = translations[sysLang] ? sysLang : 'en';
        const t = translations[lang];

        document.documentElement.lang = lang;
        document.getElementById('docTitle').textContent = t.docTitle;
        document.getElementById('titleText').textContent = t.titleText;
        document.getElementById('sizeLabel').textContent = t.sizeLabel;
        document.getElementById('collisionLabel').textContent = t.collisionLabel;
        document.getElementById('amoledLabel').textContent = t.amoledLabel;

        document.addEventListener('DOMContentLoaded', () => {
            const sizeInput = document.getElementById('size');
            const sizeValue = document.getElementById('sizeValue');
            const collisionInput = document.getElementById('collision');
            const amoledInput = document.getElementById('amoled');

            const getVal = (key, def) => {
                if (window.WallpaperEngine && window.WallpaperEngine.getSetting) {
                    const val = window.WallpaperEngine.getSetting(key, def);
                    if (val !== undefined && val !== null) return val;
                }
                const ls = localStorage.getItem(key);
                return ls !== null ? ls : def;
            };

            const setVal = (key, val) => {
                const strVal = String(val);
                if (window.WallpaperEngine && window.WallpaperEngine.saveSetting) {
                    window.WallpaperEngine.saveSetting(key, strVal);
                }
                localStorage.setItem(key, strVal);
            };

            const updateUI = () => {
                sizeValue.textContent = parseFloat(sizeInput.value).toFixed(1) + 'x';
            };

            sizeInput.value = getVal('shapeSize', '1.0');
            collisionInput.checked = getVal('enableCollision', 'true') === 'true';
            amoledInput.checked = getVal('amoledMode', 'false') === 'true';
            
            updateUI();

            sizeInput.addEventListener('input', () => {
                updateUI();
                setVal('shapeSize', sizeInput.value);
            });

            collisionInput.addEventListener('change', () => {
                setVal('enableCollision', collisionInput.checked ? 'true' : 'false');
            });

            amoledInput.addEventListener('change', () => {
                setVal('amoledMode', amoledInput.checked ? 'true' : 'false');
            });
        });
    </script>
</body>
</html>
