<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="docTitle">Settings</title>
    <style>
        :root {
            --bg: #141218;
            --surface: #211F26;
            --on-surface: #E6E0E9;
            --primary: #D0BCFF;
            --on-primary: #381E72;
            --outline: #938F99;
            --track: rgba(147, 143, 153, 0.25);
        }

        body {
            font-family: 'Google Sans', 'Google Sans Text', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--on-surface);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .header-title {
            font-size: 32px;
            font-weight: 400;
            margin: 24px 8px 0 8px;
            letter-spacing: -0.5px;
        }

        /* 
         * M3 Segmented Containers
         */
        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 3px; /* Разделитель сегментов */
        }

        .setting-item {
            background-color: var(--surface);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: background-color 0.3s ease;
        }

        .setting-item.row {
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 0;
        }

        /* Логика скруглений для сегментов */
        .setting-item { border-radius: 4px; }
        .setting-item:first-child { border-radius: 28px 28px 4px 4px; }
        .setting-item:last-child { border-radius: 4px 4px 28px 28px; }
        .setting-item:only-child { border-radius: 28px; }

        .setting-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label {
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .value-badge {
            font-size: 14px;
            color: var(--on-primary);
            background: var(--primary);
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 24px;
            transition: all 0.3s ease;
        }

        /* 
         * M3 Expressive Slider
         */
        input[type="range"] {
            width: 100%;
            margin: 8px 0;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            height: 16px;
            --slider-percent: 50%;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 16px;
            border-radius: 16px;
            background: linear-gradient(
                to right, 
                var(--primary) var(--slider-percent), 
                var(--track) var(--slider-percent)
            );
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 32px;
            border-radius: 6px;
            background: var(--primary);
            box-shadow: 0 0 0 4px var(--surface); /* Эффект выреза вокруг ползунка */
            margin-top: -8px; /* Центрируем (16 - 32) / 2 */
            transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
        }

        input[type="range"]:active::-webkit-slider-thumb {
            transform: scale(1.15);
        }

        /* 
         * Perfect M3 Switch
         */
        .switch {
            position: relative;
            display: inline-flex;
            width: 52px;
            height: 32px;
            flex-shrink: 0;
            align-items: center;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
            margin: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: transparent;
            border: 2px solid var(--outline);
            border-radius: 32px;
            box-sizing: border-box;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 6px; 
            bottom: 6px;
            background-color: var(--outline);
            border-radius: 50%;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
        }

        input:checked + .slider {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        input:checked + .slider:before {
            background-color: var(--on-primary);
            height: 24px;
            width: 24px;
            left: 22px; /* Математика: 48 (ширина внутри рамки) - 24 (ползунок) - 2 (отступ) = 22px */
            bottom: 2px;
        }
        
        /* Анимация сдавливания при нажатии */
        .switch:active .slider:before {
            width: 28px;
            border-radius: 16px;
        }
        input:checked:active + .slider:before {
            left: 18px; 
        }
    </style>
</head>
<body>
    <div class="header-title" id="titleText">Settings</div>

    <div class="settings-group">
        <div class="setting-item">
            <div class="setting-header">
                <span class="label" id="sizeLabel">Shapes size</span>
                <span class="value-badge" id="sizeValue">1.0x</span>
            </div>
            <input id="size" type="range" min="0.5" max="2.5" step="0.1" value="1.0">
        </div>

        <div class="setting-item row">
            <span class="label" id="collisionLabel">Shapes collision</span>
            <label class="switch">
                <input id="collision" type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="setting-item row">
            <span class="label" id="amoledLabel">AMOLED mode</span>
            <label class="switch">
                <input id="amoled" type="checkbox">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                docTitle: "Wallpaper Settings",
                titleText: "Settings",
                sizeLabel: "Shapes size",
                collisionLabel: "Shapes collision",
                amoledLabel: "AMOLED mode (pure black)"
            },
            ru: {
                docTitle: "Настройки обоев",
                titleText: "Настройки",
                sizeLabel: "Размер фигур",
                collisionLabel: "Столкновения фигур",
                amoledLabel: "Режим AMOLED (глубокий чёрный)"
            }
        };

        const sysLang = navigator.language.slice(0, 2);
        const lang = translations[sysLang] ? sysLang : 'en';
        const t = translations[lang];

        document.documentElement.lang = lang;
        document.getElementById('docTitle').textContent = t.docTitle;
        document.getElementById('titleText').textContent = t.titleText;
        document.getElementById('sizeLabel').textContent = t.sizeLabel;
        document.getElementById('collisionLabel').textContent = t.collisionLabel;
        document.getElementById('amoledLabel').textContent = t.amoledLabel;

        document.addEventListener('DOMContentLoaded', () => {
            const sizeInput = document.getElementById('size');
            const sizeValue = document.getElementById('sizeValue');
            const collisionInput = document.getElementById('collision');
            const amoledInput = document.getElementById('amoled');

            const getVal = (key, def) => {
                // Извлекаем настройки через API Wallify[span_0](start_span)[span_0](end_span)
                if (window.WallpaperEngine && window.WallpaperEngine.getSetting) {
                    const val = window.WallpaperEngine.getSetting(key, def);
                    if (val !== undefined && val !== null) return val;
                }
                const ls = localStorage.getItem(key);
                return ls !== null ? ls : def;
            };

            const setVal = (key, val) => {
                const strVal = String(val);
                // Сохраняем настройки через API Wallify, значения всегда конвертируем в строку[span_1](start_span)[span_1](end_span)
                if (window.WallpaperEngine && window.WallpaperEngine.saveSetting) {
                    window.WallpaperEngine.saveSetting(key, strVal);
                }
                localStorage.setItem(key, strVal);
            };

            const updateSliderBg = () => {
                const min = parseFloat(sizeInput.min) || 0.5;
                const max = parseFloat(sizeInput.max) || 2.5;
                const val = parseFloat(sizeInput.value);
                const percent = ((val - min) / (max - min)) * 100;
                sizeInput.style.setProperty('--slider-percent', `${percent}%`);
            };

            const updateUI = () => {
                sizeValue.textContent = parseFloat(sizeInput.value).toFixed(1) + 'x';
                updateSliderBg();
            };

            sizeInput.value = getVal('shapeSize', '1.0');
            collisionInput.checked = getVal('enableCollision', 'true') === 'true';
            amoledInput.checked = getVal('amoledMode', 'false') === 'true';

            updateUI();

            sizeInput.addEventListener('input', () => {
                updateUI();
                setVal('shapeSize', sizeInput.value);
            });

            collisionInput.addEventListener('change', () => {
                setVal('enableCollision', collisionInput.checked ? 'true' : 'false');
            });

            amoledInput.addEventListener('change', () => {
                setVal('amoledMode', amoledInput.checked ? 'true' : 'false');
            });

            const applyColors = (metadata) => {
                if (!metadata || !metadata.accentColors) return;
                const c = metadata.accentColors;
                const root = document.documentElement;
                
                // Извлекаем палитру Monet для всего интерфейса[span_2](start_span)[span_2](end_span)
                root.style.setProperty('--bg', c.background);
                root.style.setProperty('--surface', c.surfaceContainer);
                root.style.setProperty('--on-surface', c.onSurface);
                root.style.setProperty('--primary', c.primary);
                root.style.setProperty('--on-primary', c.onPrimary);
                root.style.setProperty('--outline', c.outline);
            };

            if (window.WallpaperEngine && window.WallpaperEngine.metadata) {
                applyColors(window.WallpaperEngine.metadata);
            }

            // Слушаем события моста для динамического обновления[span_3](start_span)[span_3](end_span)
            window.addEventListener('wallpaperEngineReady', (e) => applyColors(e.detail));
            window.addEventListener('wallpaperUpdate', (e) => applyColors(e.detail));
        });
    </script>
</body>
</html>
