<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Monet Green Orbit</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #041009;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>

  <script>
    (() => {
      "use strict";

      const canvas =
        document.getElementById("canvas");

      const ctx =
        canvas.getContext("2d", {
          alpha: false
        });

      let width = 1;
      let height = 1;
      let dpr = 1;

      let time = 0;
      let lastTime = 0;
      let paused = false;
      let frameRunning = false;

      let offsetX = 0;
      let targetOffsetX = 0;

      let rocketTimer = 1.2;

      const stars = [];
      const rockets = [];

      const settings = {
        speed: 1,
        planetScale: 1,
        starCount: 110,
        showMoon: true,
        showSatellite: true,
        showSignals: true,
        showOrbits: true
      };

      const fallbackColors = {
        background: "#041009",
        deepSpace: "#010503",
        primary: "#8ED8A5",
        primaryBright: "#D9FFE2",
        ocean: "#176B45",
        oceanDark: "#052E1D",
        land: "#79C98F",
        landBright: "#B0E8BD",
        clouds: "#E2F4E7",
        moon: "#C8DCCB",
        satellite: "#E2EEE5",
        sun: "#DFFF9E",
        sunCore: "#FAFFE4",
        signal: "#82FFA8"
      };

      let colors = {
        ...fallbackColors
      };

      const continents = [
        {
          angle: 0.1,
          latitude: -0.22,
          width: 0.42,
          height: 0.19,
          rotation: 0.25
        },
        {
          angle: 1.05,
          latitude: 0.22,
          width: 0.27,
          height: 0.31,
          rotation: -0.45
        },
        {
          angle: 1.95,
          latitude: -0.06,
          width: 0.37,
          height: 0.22,
          rotation: 0.3
        },
        {
          angle: 2.8,
          latitude: 0.34,
          width: 0.24,
          height: 0.14,
          rotation: -0.15
        },
        {
          angle: 3.65,
          latitude: -0.33,
          width: 0.29,
          height: 0.17,
          rotation: 0.5
        },
        {
          angle: 4.55,
          latitude: 0.03,
          width: 0.43,
          height: 0.25,
          rotation: -0.35
        },
        {
          angle: 5.5,
          latitude: 0.3,
          width: 0.22,
          height: 0.15,
          rotation: 0.2
        }
      ];

      const craters = [
        { x: -0.27, y: -0.12, size: 0.14 },
        { x: 0.2, y: 0.16, size: 0.1 },
        { x: 0.08, y: -0.3, size: 0.065 },
        { x: -0.04, y: 0.31, size: 0.05 }
      ];

      function clamp(value, minimum, maximum) {
        return Math.max(
          minimum,
          Math.min(maximum, value)
        );
      }

      function getSetting(key, fallback) {
        if (window.WallpaperEngine) {
          return window.WallpaperEngine.getSetting(
            key,
            String(fallback)
          );
        }

        return String(fallback);
      }

      function readNumber(
        value,
        fallback,
        minimum,
        maximum
      ) {
        const result = Number(value);

        if (!Number.isFinite(result)) {
          return fallback;
        }

        return clamp(
          result,
          minimum,
          maximum
        );
      }

      function readBoolean(value, fallback) {
        if (
          value === undefined ||
          value === null ||
          value === ""
        ) {
          return fallback;
        }

        return String(value) === "true";
      }

      function loadSettings() {
        settings.speed = readNumber(
          getSetting("speed", 1),
          1,
          0.2,
          2.5
        );

        settings.planetScale = readNumber(
          getSetting("planetScale", 1),
          1,
          0.75,
          1.3
        );

        settings.starCount = Math.round(
          readNumber(
            getSetting("starCount", 110),
            110,
            20,
            180
          )
        );

        settings.showMoon = readBoolean(
          getSetting("showMoon", true),
          true
        );

        settings.showSatellite = readBoolean(
          getSetting("showSatellite", true),
          true
        );

        settings.showSignals = readBoolean(
          getSetting("showSignals", true),
          true
        );

        settings.showOrbits = readBoolean(
          getSetting("showOrbits", true),
          true
        );

        createStars();
      }

      function hexToRgb(hex) {
        const value =
          String(hex || "")
            .replace("#", "");

        if (!/^[0-9a-fA-F]{6}$/.test(value)) {
          return {
            r: 142,
            g: 216,
            b: 165
          };
        }

        return {
          r: parseInt(value.slice(0, 2), 16),
          g: parseInt(value.slice(2, 4), 16),
          b: parseInt(value.slice(4, 6), 16)
        };
      }

      function rgba(hex, alpha) {
        const color = hexToRgb(hex);

        return (
          "rgba(" +
          color.r + "," +
          color.g + "," +
          color.b + "," +
          alpha + ")"
        );
      }

      function mix(first, second, amount) {
        const a = hexToRgb(first);
        const b = hexToRgb(second);
        const t = clamp(amount, 0, 1);

        return (
          "rgb(" +
          Math.round(a.r + (b.r - a.r) * t) +
          "," +
          Math.round(a.g + (b.g - a.g) * t) +
          "," +
          Math.round(a.b + (b.b - a.b) * t) +
          ")"
        );
      }

      function updateColors(detail) {
        const monet =
          detail &&
          detail.accentColors;

        if (!monet) {
          colors = {
            ...fallbackColors
          };

          return;
        }

        const primary =
          monet.primary ||
          fallbackColors.primary;

        const secondary =
          monet.secondary ||
          fallbackColors.land;

        const background =
          monet.background ||
          fallbackColors.background;

        colors = {
          background,

          deepSpace: mix(
            background,
            "#000000",
            0.78
          ),

          primary,

          primaryBright:
            monet.onPrimaryContainer ||
            fallbackColors.primaryBright,

          ocean:
            monet.primaryContainer ||
            fallbackColors.ocean,

          oceanDark: mix(
            monet.primaryContainer ||
            fallbackColors.ocean,
            "#000000",
            0.7
          ),

          land: secondary,

          landBright: mix(
            secondary,
            "#ffffff",
            0.35
          ),

          clouds:
            monet.onSurface ||
            fallbackColors.clouds,

          moon:
            monet.secondary ||
            fallbackColors.moon,

          satellite:
            monet.onSurface ||
            fallbackColors.satellite,

          sun: mix(
            primary,
            "#e9ff9e",
            0.62
          ),

          sunCore: mix(
            primary,
            "#ffffff",
            0.85
          ),

          signal:
            monet.tertiary ||
            fallbackColors.signal
        };
      }

      function seededRandom(seed) {
        const value =
          Math.sin(seed * 912.47) *
          43758.5453;

        return value - Math.floor(value);
      }

      function createStars() {
        stars.length = 0;

        for (
          let index = 0;
          index < settings.starCount;
          index++
        ) {
          stars.push({
            x: seededRandom(index * 5 + 1),
            y: seededRandom(index * 7 + 2),

            radius:
              0.4 +
              seededRandom(index * 11 + 3) *
              1.4,

            alpha:
              0.25 +
              seededRandom(index * 13 + 4) *
              0.65,

            phase:
              seededRandom(index * 17 + 5) *
              Math.PI *
              2,

            speed:
              0.25 +
              seededRandom(index * 19 + 6) *
              0.7,

            depth:
              0.3 +
              seededRandom(index * 23 + 7) *
              0.7
          });
        }
      }

      function resize() {
        width =
          Math.max(1, window.innerWidth);

        height =
          Math.max(1, window.innerHeight);

        dpr = Math.min(
          window.devicePixelRatio || 1,
          2
        );

        canvas.width =
          Math.round(width * dpr);

        canvas.height =
          Math.round(height * dpr);

        canvas.style.width =
          width + "px";

        canvas.style.height =
          height + "px";

        ctx.setTransform(
          dpr,
          0,
          0,
          dpr,
          0,
          0
        );
      }

      function circle(x, y, radius, color) {
        ctx.beginPath();

        ctx.arc(
          x,
          y,
          radius,
          0,
          Math.PI * 2
        );

        ctx.fillStyle = color;
        ctx.fill();
      }

      function getScene() {
        const radius = clamp(
          Math.min(width, height) *
          0.225 *
          settings.planetScale,
          85,
          220
        );

        return {
          x:
            width * 0.53 +
            offsetX * width * 0.045,

          y:
            height * 0.61,

          radius
        };
      }

      function drawBackground() {
        const gradient =
          ctx.createRadialGradient(
            width * 0.48,
            height * 0.5,
            0,
            width * 0.48,
            height * 0.5,
            Math.max(width, height) * 0.85
          );

        gradient.addColorStop(
          0,
          mix(
            colors.background,
            colors.ocean,
            0.14
          )
        );

        gradient.addColorStop(
          0.55,
          colors.background
        );

        gradient.addColorStop(
          1,
          colors.deepSpace
        );

        ctx.globalAlpha = 1;
        ctx.fillStyle = gradient;

        ctx.fillRect(
          0,
          0,
          width,
          height
        );
      }

      function drawStars() {
        for (const star of stars) {
          const pulse =
            0.8 +
            Math.sin(
              time * star.speed +
              star.phase
            ) *
            0.2;

          ctx.globalAlpha =
            star.alpha * pulse;

          circle(
            star.x * width +
              offsetX *
              12 *
              star.depth,

            star.y * height,

            star.radius,

            colors.primaryBright
          );
        }

        ctx.globalAlpha = 1;
      }

      function drawSun() {
        const radius = clamp(
          Math.min(width, height) * 0.115,
          45,
          112
        );

        const x =
          width * 0.08 +
          offsetX * 5;

        const y =
          height * 0.16;

        const glow =
          ctx.createRadialGradient(
            x,
            y,
            radius * 0.1,
            x,
            y,
            radius * 3.3
          );

        glow.addColorStop(
          0,
          rgba(colors.sunCore, 0.72)
        );

        glow.addColorStop(
          0.25,
          rgba(colors.sun, 0.28)
        );

        glow.addColorStop(
          1,
          rgba(colors.sun, 0)
        );

        ctx.fillStyle = glow;

        ctx.fillRect(
          0,
          0,
          width,
          height
        );

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(time * 0.035);

        for (
          let index = 0;
          index < 16;
          index++
        ) {
          const angle =
            index / 16 *
            Math.PI *
            2;

          const length =
            radius *
            (
              1.4 +
              (index % 3) * 0.14 +
              Math.sin(time * 0.6 + index) *
              0.06
            );

          ctx.beginPath();

          ctx.moveTo(
            Math.cos(angle) * radius * 1.04,
            Math.sin(angle) * radius * 1.04
          );

          ctx.lineTo(
            Math.cos(angle) * length,
            Math.sin(angle) * length
          );

          ctx.strokeStyle =
            rgba(colors.sun, 0.19);

          ctx.lineWidth =
            index % 2 === 0
              ? 2
              : 1;

          ctx.stroke();
        }

        ctx.restore();

        const surface =
          ctx.createRadialGradient(
            x - radius * 0.33,
            y - radius * 0.36,
            radius * 0.05,
            x,
            y,
            radius
          );

        surface.addColorStop(
          0,
          colors.sunCore
        );

        surface.addColorStop(
          0.55,
          colors.sun
        );

        surface.addColorStop(
          1,
          mix(
            colors.sun,
            colors.primary,
            0.55
          )
        );

        circle(
          x,
          y,
          radius,
          surface
        );

        ctx.save();

        ctx.beginPath();
        ctx.arc(
          x,
          y,
          radius,
          0,
          Math.PI * 2
        );
        ctx.clip();

        for (
          let index = 0;
          index < 8;
          index++
        ) {
          const spotX =
            x +
            Math.sin(
              time * 0.07 +
              index * 1.62
            ) *
            radius *
            0.63;

          const spotY =
            y +
            Math.cos(index * 2.1) *
            radius *
            0.52;

          ctx.globalAlpha = 0.1;

          circle(
            spotX,
            spotY,
            radius *
              (
                0.045 +
                (index % 3) * 0.025
              ),
            colors.primary
          );
        }

        ctx.restore();
        ctx.globalAlpha = 1;
      }

      function drawOrbit(
        x,
        y,
        radiusX,
        radiusY,
        alpha
      ) {
        if (!settings.showOrbits) {
          return;
        }

        ctx.beginPath();

        ctx.ellipse(
          x,
          y,
          radiusX,
          radiusY,
          0,
          0,
          Math.PI * 2
        );

        ctx.strokeStyle =
          rgba(colors.primary, alpha);

        ctx.lineWidth = 1;
        ctx.setLineDash([4, 8]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function getMoon(scene) {
        const angle =
          time *
          0.33 *
          settings.speed;

        return {
          angle,

          x:
            scene.x +
            Math.cos(angle) *
            scene.radius *
            1.85,

          y:
            scene.y +
            Math.sin(angle) *
            scene.radius *
            0.72,

          radius:
            scene.radius * 0.17
        };
      }

      function drawMoon(moon) {
        const glow =
          ctx.createRadialGradient(
            moon.x,
            moon.y,
            moon.radius * 0.4,
            moon.x,
            moon.y,
            moon.radius * 1.7
          );

        glow.addColorStop(
          0,
          rgba(colors.moon, 0.16)
        );

        glow.addColorStop(
          1,
          rgba(colors.moon, 0)
        );

        circle(
          moon.x,
          moon.y,
          moon.radius * 1.7,
          glow
        );

        const surface =
          ctx.createRadialGradient(
            moon.x - moon.radius * 0.35,
            moon.y - moon.radius * 0.38,
            moon.radius * 0.04,
            moon.x,
            moon.y,
            moon.radius
          );

        surface.addColorStop(
          0,
          mix(colors.moon, "#ffffff", 0.35)
        );

        surface.addColorStop(
          0.58,
          colors.moon
        );

        surface.addColorStop(
          1,
          mix(colors.moon, "#000000", 0.68)
        );

        circle(
          moon.x,
          moon.y,
          moon.radius,
          surface
        );

        ctx.save();

        ctx.beginPath();
        ctx.arc(
          moon.x,
          moon.y,
          moon.radius,
          0,
          Math.PI * 2
        );
        ctx.clip();

        for (const crater of craters) {
          const x =
            moon.x +
            crater.x *
            moon.radius;

          const y =
            moon.y +
            crater.y *
            moon.radius;

          const radius =
            crater.size *
            moon.radius;

          circle(
            x,
            y,
            radius,
            "rgba(0,0,0,0.16)"
          );

          ctx.beginPath();

          ctx.arc(
            x - radius * 0.15,
            y - radius * 0.18,
            radius * 0.75,
            Math.PI,
            Math.PI * 2
          );

          ctx.strokeStyle =
            "rgba(255,255,255,0.13)";

          ctx.lineWidth = 1;
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawContinentShape(
        x,
        y,
        widthValue,
        heightValue,
        rotation,
        color
      ) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);

        ctx.beginPath();

        ctx.ellipse(
          0,
          0,
          widthValue,
          heightValue,
          0,
          0,
          Math.PI * 2
        );

        ctx.ellipse(
          widthValue * 0.44,
          -heightValue * 0.2,
          widthValue * 0.57,
          heightValue * 0.56,
          0.2,
          0,
          Math.PI * 2
        );

        ctx.ellipse(
          -widthValue * 0.37,
          heightValue * 0.27,
          widthValue * 0.49,
          heightValue * 0.48,
          -0.3,
          0,
          Math.PI * 2
        );

        ctx.fillStyle = color;
        ctx.fill();

        ctx.restore();
      }

      function drawPlanet(scene) {
        const x = scene.x;
        const y = scene.y;
        const radius = scene.radius;

        const atmosphere =
          ctx.createRadialGradient(
            x,
            y,
            radius * 0.75,
            x,
            y,
            radius * 1.32
          );

        atmosphere.addColorStop(
          0,
          rgba(colors.primary, 0)
        );

        atmosphere.addColorStop(
          0.72,
          rgba(colors.primary, 0.06)
        );

        atmosphere.addColorStop(
          0.86,
          rgba(colors.primary, 0.25)
        );

        atmosphere.addColorStop(
          1,
          rgba(colors.primary, 0)
        );

        circle(
          x,
          y,
          radius * 1.33,
          atmosphere
        );

        ctx.save();

        ctx.beginPath();
        ctx.arc(
          x,
          y,
          radius,
          0,
          Math.PI * 2
        );
        ctx.clip();

        const ocean =
          ctx.createRadialGradient(
            x - radius * 0.42,
            y - radius * 0.45,
            radius * 0.04,
            x,
            y,
            radius * 1.15
          );

        ocean.addColorStop(
          0,
          mix(
            colors.ocean,
            colors.primaryBright,
            0.38
          )
        );

        ocean.addColorStop(
          0.38,
          colors.ocean
        );

        ocean.addColorStop(
          0.76,
          colors.oceanDark
        );

        ocean.addColorStop(
          1,
          mix(
            colors.oceanDark,
            "#000000",
            0.72
          )
        );

        ctx.fillStyle = ocean;

        ctx.fillRect(
          x - radius,
          y - radius,
          radius * 2,
          radius * 2
        );

        const rotation =
          time *
          0.19 *
          settings.speed;

        for (const continent of continents) {
          let longitude =
            continent.angle + rotation;

          longitude =
            ((longitude + Math.PI) %
              (Math.PI * 2) +
              Math.PI * 2) %
              (Math.PI * 2) -
            Math.PI;

          const depth =
            Math.cos(longitude);

          if (depth <= 0) {
            continue;
          }

          const continentX =
            x +
            Math.sin(longitude) *
            radius *
            0.8;

          const continentY =
            y +
            continent.latitude *
            radius;

          const continentWidth =
            radius *
            continent.width *
            Math.max(0.12, depth);

          const continentHeight =
            radius *
            continent.height;

          const landGradient =
            ctx.createLinearGradient(
              continentX,
              continentY - continentHeight,
              continentX,
              continentY + continentHeight
            );

          landGradient.addColorStop(
            0,
            colors.landBright
          );

          landGradient.addColorStop(
            1,
            colors.land
          );

          ctx.globalAlpha =
            0.62 +
            depth * 0.28;

          drawContinentShape(
            continentX,
            continentY,
            continentWidth,
            continentHeight,
            continent.rotation,
            landGradient
          );
        }

        /*
         * Движущиеся облака.
         */
        ctx.globalAlpha = 0.16;

        for (
          let band = -3;
          band <= 3;
          band++
        ) {
          const wave =
            Math.sin(
              time * 0.25 +
              band * 1.3
            ) *
            radius *
            0.08;

          ctx.beginPath();

          ctx.ellipse(
            x + wave,
            y + band * radius * 0.2,
            radius * 0.85,
            radius * 0.065,
            0,
            0,
            Math.PI * 2
          );

          ctx.strokeStyle = colors.clouds;
          ctx.lineWidth =
            Math.max(2, radius * 0.025);

          ctx.stroke();
        }

        ctx.globalAlpha = 1;

        /*
         * Ночная сторона.
         */
        const night =
          ctx.createLinearGradient(
            x - radius,
            y,
            x + radius,
            y
          );

        night.addColorStop(
          0,
          "rgba(0,0,0,0)"
        );

        night.addColorStop(
          0.5,
          "rgba(0,0,0,0.03)"
        );

        night.addColorStop(
          0.78,
          "rgba(0,0,0,0.5)"
        );

        night.addColorStop(
          1,
          "rgba(0,0,0,0.88)"
        );

        ctx.fillStyle = night;

        ctx.fillRect(
          x - radius,
          y - radius,
          radius * 2,
          radius * 2
        );

        /*
         * Блик от Солнца.
         */
        const light =
          ctx.createRadialGradient(
            x - radius * 0.55,
            y - radius * 0.48,
            0,
            x - radius * 0.55,
            y - radius * 0.48,
            radius * 0.75
          );

        light.addColorStop(
          0,
          rgba(colors.sunCore, 0.23)
        );

        light.addColorStop(
          1,
          rgba(colors.sunCore, 0)
        );

        ctx.fillStyle = light;

        ctx.fillRect(
          x - radius,
          y - radius,
          radius * 2,
          radius * 2
        );

        ctx.restore();

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          radius,
          0,
          Math.PI * 2
        );

        ctx.strokeStyle =
          rgba(colors.primary, 0.58);

        ctx.lineWidth =
          Math.max(2, radius * 0.018);

        ctx.stroke();

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          radius * 1.025,
          Math.PI * 0.62,
          Math.PI * 1.52
        );

        ctx.strokeStyle =
          rgba(colors.primary, 0.25);

        ctx.lineWidth =
          radius * 0.045;

        ctx.stroke();
      }

      function getSatellite(scene) {
        const angle =
          time *
          0.52 *
          settings.speed +
          2.15;

        return {
          angle,

          x:
            scene.x +
            Math.cos(angle) *
            scene.radius *
            2.35,

          y:
            scene.y +
            Math.sin(angle) *
            scene.radius *
            0.98,

          size:
            clamp(
              scene.radius * 0.13,
              14,
              28
            )
        };
      }

      function drawPanel(
        x,
        y,
        widthValue,
        heightValue
      ) {
        ctx.fillStyle =
          mix(
            colors.ocean,
            "#000000",
            0.35
          );

        ctx.fillRect(
          x,
          y,
          widthValue,
          heightValue
        );

        ctx.strokeStyle =
          rgba(colors.primary, 0.9);

        ctx.lineWidth = 1;
        ctx.strokeRect(
          x,
          y,
          widthValue,
          heightValue
        );

        ctx.beginPath();

        ctx.moveTo(
          x + widthValue / 2,
          y
        );

        ctx.lineTo(
          x + widthValue / 2,
          y + heightValue
        );

        ctx.moveTo(
          x,
          y + heightValue / 2
        );

        ctx.lineTo(
          x + widthValue,
          y + heightValue / 2
        );

        ctx.strokeStyle =
          rgba(colors.primary, 0.42);

        ctx.stroke();
      }

      function drawSignals(satellite) {
        if (!settings.showSignals) {
          return;
        }

        const cycle =
          (time * settings.speed) % 2;

        ctx.save();

        ctx.translate(
          satellite.x,
          satellite.y
        );

        ctx.rotate(
          satellite.angle +
          Math.PI / 2
        );

        for (
          let index = 0;
          index < 3;
          index++
        ) {
          const progress =
            (
              cycle / 2 -
              index * 0.16 +
              1
            ) % 1;

          ctx.beginPath();

          ctx.arc(
            0,
            0,
            satellite.size *
              (0.8 + progress * 2.4),
            -0.8,
            0.8
          );

          ctx.strokeStyle =
            rgba(
              colors.signal,
              Math.max(
                0,
                0.65 - progress * 0.58
              )
            );

          ctx.lineWidth =
            2 - progress;

          ctx.stroke();
        }

        ctx.restore();
      }

      function drawSatellite(satellite) {
        ctx.save();

        ctx.translate(
          satellite.x,
          satellite.y
        );

        ctx.rotate(
          satellite.angle +
          Math.PI / 2
        );

        const size = satellite.size;

        ctx.shadowColor =
          rgba(colors.primary, 0.65);

        ctx.shadowBlur = size * 0.5;

        ctx.fillStyle =
          colors.satellite;

        ctx.fillRect(
          -size * 0.32,
          -size * 0.25,
          size * 0.64,
          size * 0.5
        );

        ctx.shadowBlur = 0;

        drawPanel(
          -size * 1.22,
          -size * 0.3,
          size * 0.78,
          size * 0.6
        );

        drawPanel(
          size * 0.44,
          -size * 0.3,
          size * 0.78,
          size * 0.6
        );

        ctx.beginPath();

        ctx.moveTo(
          0,
          -size * 0.25
        );

        ctx.lineTo(
          0,
          -size * 0.75
        );

        ctx.strokeStyle =
          colors.satellite;

        ctx.lineWidth = 1.5;
        ctx.stroke();

        circle(
          0,
          -size * 0.8,
          size * 0.1,
          colors.signal
        );

        ctx.beginPath();

        ctx.arc(
          0,
          size * 0.27,
          size * 0.3,
          0,
          Math.PI
        );

        ctx.strokeStyle =
          colors.primary;

        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.restore();
      }

      function launchRocket(scene) {
        const surfaceAngle =
          -2.25 +
          Math.random() * 0.85;

        const x =
          scene.x +
          Math.cos(surfaceAngle) *
          scene.radius *
          0.94;

        const y =
          scene.y +
          Math.sin(surfaceAngle) *
          scene.radius *
          0.94;

        rockets.push({
          x,
          y,

          vx:
            Math.cos(surfaceAngle) *
            (32 + Math.random() * 13),

          vy:
            Math.sin(surfaceAngle) *
            (32 + Math.random() * 13),

          angle: surfaceAngle,
          age: 0,

          duration:
            4.2 +
            Math.random() * 1.2,

          size:
            clamp(
              scene.radius * 0.055,
              6,
              12
            ),

          trail: []
        });

        if (rockets.length > 4) {
          rockets.shift();
        }
      }

      function updateRockets(dt, scene) {
        rocketTimer -= dt;

        if (rocketTimer <= 0) {
          launchRocket(scene);

          rocketTimer =
            3.2 +
            Math.random() * 3.5;
        }

        for (
          let index = rockets.length - 1;
          index >= 0;
          index--
        ) {
          const rocket = rockets[index];

          rocket.age += dt;

          rocket.vx *=
            Math.pow(0.994, dt * 60);

          rocket.vy *=
            Math.pow(0.994, dt * 60);

          rocket.x +=
            rocket.vx * dt;

          rocket.y +=
            rocket.vy * dt;

          rocket.angle =
            Math.atan2(
              rocket.vy,
              rocket.vx
            );

          rocket.trail.push({
            x: rocket.x,
            y: rocket.y
          });

          if (rocket.trail.length > 18) {
            rocket.trail.shift();
          }

          if (
            rocket.age >=
            rocket.duration
          ) {
            rockets.splice(index, 1);
          }
        }
      }

      function drawRocket(rocket) {
        const fade =
          clamp(
            1 -
            rocket.age /
            rocket.duration,
            0,
            1
          );

        if (rocket.trail.length > 1) {
          ctx.beginPath();

          ctx.moveTo(
            rocket.trail[0].x,
            rocket.trail[0].y
          );

          for (
            let index = 1;
            index < rocket.trail.length;
            index++
          ) {
            ctx.lineTo(
              rocket.trail[index].x,
              rocket.trail[index].y
            );
          }

          ctx.strokeStyle =
            rgba(colors.sun, 0.25 * fade);

          ctx.lineWidth =
            rocket.size * 0.75;

          ctx.lineCap = "round";
          ctx.stroke();

          ctx.strokeStyle =
            rgba(colors.sunCore, 0.45 * fade);

          ctx.lineWidth =
            rocket.size * 0.25;

          ctx.stroke();
        }

        ctx.save();

        ctx.translate(
          rocket.x,
          rocket.y
        );

        ctx.rotate(
          rocket.angle +
          Math.PI / 2
        );

        ctx.globalAlpha = fade;

        /*
         * Пламя.
         */
        ctx.beginPath();

        ctx.moveTo(
          -rocket.size * 0.25,
          rocket.size * 0.45
        );

        ctx.lineTo(
          0,
          rocket.size *
            (
              1.35 +
              Math.sin(time * 24) * 0.16
            )
        );

        ctx.lineTo(
          rocket.size * 0.25,
          rocket.size * 0.45
        );

        ctx.closePath();

        ctx.fillStyle =
          colors.sun;

        ctx.fill();

        /*
         * Корпус.
         */
        ctx.beginPath();

        ctx.moveTo(
          0,
          -rocket.size
        );

        ctx.quadraticCurveTo(
          rocket.size * 0.45,
          -rocket.size * 0.35,
          rocket.size * 0.32,
          rocket.size * 0.48
        );

        ctx.lineTo(
          -rocket.size * 0.32,
          rocket.size * 0.48
        );

        ctx.quadraticCurveTo(
          -rocket.size * 0.45,
          -rocket.size * 0.35,
          0,
          -rocket.size
        );

        ctx.fillStyle =
          colors.satellite;

        ctx.fill();

        /*
         * Окно.
         */
        circle(
          0,
          -rocket.size * 0.33,
          rocket.size * 0.16,
          colors.primary
        );

        /*
         * Боковые стабилизаторы.
         */
        ctx.beginPath();

        ctx.moveTo(
          -rocket.size * 0.3,
          rocket.size * 0.12
        );

        ctx.lineTo(
          -rocket.size * 0.68,
          rocket.size * 0.62
        );

        ctx.lineTo(
          -rocket.size * 0.25,
          rocket.size * 0.43
        );

        ctx.closePath();

        ctx.moveTo(
          rocket.size * 0.3,
          rocket.size * 0.12
        );

        ctx.lineTo(
          rocket.size * 0.68,
          rocket.size * 0.62
        );

        ctx.lineTo(
          rocket.size * 0.25,
          rocket.size * 0.43
        );

        ctx.closePath();

        ctx.fillStyle =
          colors.primary;

        ctx.fill();

        ctx.restore();
        ctx.globalAlpha = 1;
      }

      function update(dt) {
        time += dt;

        offsetX +=
          (
            targetOffsetX -
            offsetX
          ) *
          Math.min(1, dt * 4);
      }

      function render() {
        const scene = getScene();
        const moon = getMoon(scene);
        const satellite =
          getSatellite(scene);

        drawBackground();
        drawStars();
        drawSun();

        drawOrbit(
          scene.x,
          scene.y,
          scene.radius * 1.85,
          scene.radius * 0.72,
          0.18
        );

        drawOrbit(
          scene.x,
          scene.y,
          scene.radius * 2.35,
          scene.radius * 0.98,
          0.13
        );

        /*
         * Объекты на дальней части орбиты.
         */
        if (
          settings.showMoon &&
          Math.sin(moon.angle) < 0
        ) {
          drawMoon(moon);
        }

        if (
          settings.showSatellite &&
          Math.sin(satellite.angle) < 0
        ) {
          drawSignals(satellite);
          drawSatellite(satellite);
        }

        drawPlanet(scene);

        /*
         * Ракеты появляются поверх планеты.
         */
        for (const rocket of rockets) {
          drawRocket(rocket);
        }

        /*
         * Объекты на передней части орбиты.
         */
        if (
          settings.showMoon &&
          Math.sin(moon.angle) >= 0
        ) {
          drawMoon(moon);
        }

        if (
          settings.showSatellite &&
          Math.sin(satellite.angle) >= 0
        ) {
          drawSignals(satellite);
          drawSatellite(satellite);
        }
      }

      function frame(now) {
        frameRunning = false;

        if (paused) {
          return;
        }

        if (!lastTime) {
          lastTime = now;
        }

        const dt = Math.min(
          (now - lastTime) / 1000,
          0.1
        );

        lastTime = now;

        update(dt);

        const scene = getScene();

        updateRockets(
          dt,
          scene
        );

        render();
        requestFrame();
      }

      function requestFrame() {
        if (
          paused ||
          frameRunning
        ) {
          return;
        }

        frameRunning = true;

        requestAnimationFrame(
          frame
        );
      }

      function pause() {
        paused = true;
        lastTime = 0;
      }

      function resume() {
        paused = false;
        lastTime = 0;
        requestFrame();
      }

      window.addEventListener(
        "wallpaperEngineReady",
        event => {
          loadSettings();
          updateColors(event.detail);
          resume();
        }
      );

      window.addEventListener(
        "wallpaperUpdate",
        event => {
          loadSettings();
          updateColors(event.detail);
        }
      );

      window.addEventListener(
        "wallpaperThemeChange",
        event => {
          updateColors(event.detail);
        }
      );

      window.addEventListener(
        "wallpaperPause",
        pause
      );

      window.addEventListener(
        "wallpaperResume",
        resume
      );

      window.addEventListener(
        "wallpaperScreenOff",
        pause
      );

      window.addEventListener(
        "wallpaperScreenOn",
        event => {
          updateColors(event.detail);
          resume();
        }
      );

      window.addEventListener(
        "wallpaperOffset",
        event => {
          const value = Number(
            event.detail &&
            event.detail.xOffset
          );

          if (Number.isFinite(value)) {
            targetOffsetX =
              (value - 0.5) * 2;
          }
        }
      );

      window.addEventListener(
        "resize",
        resize
      );

      /*
       * Запуск в обычном браузере.
       */
      resize();
      loadSettings();

      if (window.WallpaperEngine) {
        try {
          updateColors(
            window.WallpaperEngine.getMetadata()
          );
        } catch (error) {
          updateColors(null);
        }
      } else {
        updateColors(null);
      }

      requestFrame();
    })();
  </script>
</body>
</html>
