<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material 3 Shapes</title>
    <style>
        :root {
            --bg: #141218;
            --surface: #211F26;
            --primary: #6750A4;
            --secondary: #625B71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg);
            overflow: hidden;
            position: relative;
            transition: background-color 0.5s ease;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Рисуем в полном разрешении CSS-пикселей. Приложение и так растеризует страницу
        // в масштабе из настройки «Качество рендеринга» (по умолчанию 80 %) — уменьшать
        // канвас ещё раз значит мылить фигуры дважды.
        const renderScale = 1.0;

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const w = window.innerWidth || 360;
            const h = window.innerHeight || 640;

            canvas.width = Math.floor(w * dpr * renderScale);
            canvas.height = Math.floor(h * dpr * renderScale);

            ctx.resetTransform();
            ctx.scale(dpr * renderScale, dpr * renderScale);
        }

        window.addEventListener('resize', resizeCanvas);

        let isLocked = false;
        let isPaused = false;
        let currentStrokeWidth = 0.0;
        let targetStrokeWidth = 0.0;

        let themeColors = {
            bg: '#141218',
            surface: '#211F26',
            primary: '#6750A4',
            secondary: '#625B71'
        };

        function getSpeedMultiplier() {
            try {
                if (window.WallpaperEngine && window.WallpaperEngine.getSetting) {
                    const val = window.WallpaperEngine.getSetting('speed', 'normal');
                    if (val === 'slow') return 0.5;
                    if (val === 'fast') return 1.8;
                }
            } catch(e){}
            return 1.0;
        }

        function getTargetShapeCount() {
            try {
                if (window.WallpaperEngine && window.WallpaperEngine.getSetting) {
                    const val = parseInt(window.WallpaperEngine.getSetting('shapeCount', '6'));
                    if (!isNaN(val) && val >= 2 && val <= 20) return val;
                }
            } catch(e){}
            return 6;
        }

        class M3Shape {
            constructor(id, type, radius) {
                this.id = id;
                this.type = type;
                this.radius = radius || 50;
                const w = window.innerWidth || 360;
                const h = window.innerHeight || 640;
                this.x = Math.random() * (w - this.radius * 2) + this.radius;
                this.y = Math.random() * (h - this.radius * 2) + this.radius;
                this.vx = (Math.random() - 0.5) * 1.2;
                this.vy = (Math.random() - 0.5) * 1.2;
                this.rotation = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.01;
            }

            update(shapes) {
                if (isPaused) return;

                const mult = getSpeedMultiplier();
                this.x += this.vx * mult;
                this.y += this.vy * mult;
                this.rotation += this.vRot * mult;

                const w = window.innerWidth || 360;
                const h = window.innerHeight || 640;

                if (this.x - this.radius < 0) { this.x = this.radius; this.vx = Math.abs(this.vx); }
                if (this.x + this.radius > w) { this.x = w - this.radius; this.vx = -Math.abs(this.vx); }
                if (this.y - this.radius < 0) { this.y = this.radius; this.vy = Math.abs(this.vy); }
                if (this.y + this.radius > h) { this.y = h - this.radius; this.vy = -Math.abs(this.vy); }

                for (let other of shapes) {
                    if (other.id === this.id) continue;
                    let dx = other.x - this.x;
                    let dy = other.y - this.y;
                    let dist = Math.hypot(dx, dy);
                    let minDist = this.radius + other.radius + 30;

                    if (dist < minDist && dist > 0) {
                        let overlap = (minDist - dist) * 0.04;
                        let nx = dx / dist;
                        let ny = dy / dist;

                        this.x -= nx * overlap;
                        this.y -= ny * overlap;
                        other.x += nx * overlap;
                        other.y += ny * overlap;

                        this.vx -= nx * 0.015;
                        this.vy -= ny * 0.015;
                        other.vx += nx * 0.015;
                        other.vy += ny * 0.015;
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                ctx.fillStyle = themeColors.surface;
                ctx.strokeStyle = themeColors.primary;
                ctx.lineWidth = Math.max(0, currentStrokeWidth);

                ctx.beginPath();

                if (this.type === 'circle') {
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                } else if (this.type === 'squircle') {
                    let r = this.radius;
                    let corner = r * 0.45;
                    ctx.roundRect(-r, -r, r * 2, r * 2, corner);
                } else if (this.type === 'pill') {
                    let w = this.radius * 1.5;
                    let h = this.radius * 0.85;
                    ctx.roundRect(-w, -h, w * 2, h * 2, h);
                } else {
                    let r = this.radius * 0.9;
                    ctx.roundRect(-r, -r, r * 2, r * 2, 28);
                }

                ctx.fill();
                if (currentStrokeWidth > 0.1) {
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        let shapes = [];

        function updateShapesCount() {
            const targetCount = getTargetShapeCount();
            const types = ['circle', 'squircle', 'pill', 'rounded_diamond'];
            while (shapes.length < targetCount) {
                const id = shapes.length + 1;
                const type = types[shapes.length % types.length];
                const radius = 50 + (shapes.length % 3) * 10;
                shapes.push(new M3Shape(id, type, radius));
            }
            while (shapes.length > targetCount) {
                shapes.pop();
            }
        }

        resizeCanvas();
        updateShapesCount();

        function render() {
            if (isPaused) return;

            try {
                updateShapesCount();
                currentStrokeWidth += (targetStrokeWidth - currentStrokeWidth) * 0.1;

                ctx.fillStyle = themeColors.bg;
                ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

                for (let shape of shapes) {
                    shape.update(shapes);
                    shape.draw();
                }
            } catch(e) {
                console.error("Render error:", e);
            }

            requestAnimationFrame(render);
        }
        render();

        function updateMetadata(data) {
            if (!data) return;

            if (data.accentColors) {
                themeColors.bg = data.accentColors.background || '#141218';
                themeColors.surface = data.accentColors.surfaceContainer || '#211F26';
                themeColors.primary = data.accentColors.primary || '#6750A4';
                themeColors.secondary = data.accentColors.secondary || '#625B71';
                document.body.style.backgroundColor = themeColors.bg;
            }

            isLocked = !data.isUnlocked || data.screen === 'lock';
            targetStrokeWidth = isLocked ? 8.0 : 0.0;
        }

        window.addEventListener('wallpaperUpdate', (e) => updateMetadata(e.detail));
        window.addEventListener('wallpaperUnlock', (e) => updateMetadata(e.detail));
        window.addEventListener('wallpaperThemeChange', (e) => updateMetadata(e.detail));

        window.addEventListener('wallpaperScreenOn', () => {
            for (let shape of shapes) {
                shape.vx = (Math.random() - 0.5) * 3.5;
                shape.vy = (Math.random() - 0.5) * 3.5;
            }
        });

        window.addEventListener('wallpaperPause', () => { isPaused = true; });
        window.addEventListener('wallpaperResume', () => {
            if (isPaused) {
                isPaused = false;
                render();
            }
        });
    </script>
</body>
</html>
