<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M3 Expressive Lite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F7F2FA;
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = 0, height = 0;
    let isPaused = false;
    let lastTime = performance.now();

    let speedMult = 1.0;
    let blobScaleMult = 1.0;
    let targetBlobCount = 3;
    let themeMode = 'light';
    let useGyro = true;

    let gyroOffsetX = 0, gyroOffsetY = 0;
    let targetGyroX = 0, targetGyroY = 0;

    const darkPalette = {
      background: '#141218',
      primary: '#D0BCFF',
      secondary: '#CCC2DC',
      tertiary: '#EFB8C8'
    };

    const lightPalette = {
      background: '#F7F2FA',
      primary: '#E8DEF8',
      secondary: '#E8DDFF',
      tertiary: '#FFD8E4'
    };

    let colors = { ...lightPalette };
    let unlockImpulse = 0;

    class LiteShape {
      constructor(xRatio, yRatio, radiusRatio, colorKey, speedScale) {
        this.x = xRatio;
        this.y = yRatio;
        this.baseRadius = radiusRatio;
        this.colorKey = colorKey;
        this.speedScale = speedScale;

        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * 0.00012 * this.speedScale;
        this.vy = Math.sin(angle) * 0.00012 * this.speedScale;
        this.morphPhase = Math.random() * Math.PI * 2;
      }

      updateAndDraw(dt, currentColors, impulse) {
        const maxDim = Math.max(width, height);
        const spring = 1 + Math.sin(impulse * Math.PI * 3) * 0.2 * impulse;
        const radius = this.baseRadius * blobScaleMult * maxDim * spring;

        const rX = radius / width;
        const rY = radius / height;

        this.x += this.vx * speedMult * dt;
        this.y += this.vy * speedMult * dt;

        if (this.x - rX <= 0 || this.x + rX >= 1) this.vx *= -1;
        if (this.y - rY <= 0 || this.y + rY >= 1) this.vy *= -1;

        this.morphPhase += 0.001 * dt;

        const shiftX = useGyro ? gyroOffsetX * this.speedScale * 40 : 0;
        const shiftY = useGyro ? gyroOffsetY * this.speedScale * 40 : 0;

        const cx = this.x * width + shiftX;
        const cy = this.y * height + shiftY;

        // Мягкое размытие через радиальный градиент (быстрее, чем ctx.filter = blur)
        const hexColor = currentColors[this.colorKey] || currentColors.primary;
        const grad = ctx.createRadialGradient(cx, cy, radius * 0.2, cx, cy, radius * 1.2);
        
        const alpha = themeMode === 'light' ? '0.7' : '0.5';
        grad.addColorStop(0, hexColor);
        grad.addColorStop(0.7, hexColor + 'B0');
        grad.addColorStop(1, 'transparent');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 1.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    let blobs = [];

    function rebuildBlobs(count) {
      const keys = ['primary', 'secondary', 'tertiary'];
      blobs = [];
      for (let i = 0; i < count; i++) {
        blobs.push(new LiteShape(
          0.3 + Math.random() * 0.4,
          0.3 + Math.random() * 0.4,
          0.18 + Math.random() * 0.06,
          keys[i % keys.length],
          0.8 + Math.random() * 0.4
        ));
      }
    }

    function loadSettings() {
      if (!window.WallpaperEngine) return;
      const engine = window.WallpaperEngine;
      speedMult = parseFloat(engine.getSetting('speed', '1.0'));
      blobScaleMult = parseFloat(engine.getSetting('blobScale', '1.0'));
      themeMode = engine.getSetting('themeMode', 'light');
      useGyro = engine.getSetting('useGyro', 'true') === 'true';

      const defaultPalette = themeMode === 'light' ? lightPalette : darkPalette;
      colors = { ...defaultPalette, ...colors };
      document.body.style.backgroundColor = colors.background;

      const newCount = parseInt(engine.getSetting('blobCount', '3'), 10);
      if (newCount !== targetBlobCount || blobs.length === 0) {
        targetBlobCount = newCount;
        rebuildBlobs(targetBlobCount);
      }
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    function handleOrientation(e) {
      if (!useGyro) return;
      targetGyroX = Math.max(-1, Math.min(1, (e.gamma || 0) / 45));
      targetGyroY = Math.max(-1, Math.min(1, (e.beta || 0) / 45));
    }

    window.addEventListener('deviceorientation', handleOrientation);
    window.addEventListener('wallpaperGyroscope', (e) => {
      if (!useGyro || !e.detail) return;
      targetGyroX = e.detail.x || 0;
      targetGyroY = e.detail.y || 0;
    });

    function frame(now) {
      if (isPaused) return;

      const dt = Math.min(now - lastTime, 100);
      lastTime = now;

      gyroOffsetX += (targetGyroX - gyroOffsetX) * 0.05;
      gyroOffsetY += (targetGyroY - gyroOffsetY) * 0.05;

      if (unlockImpulse > 0) {
        unlockImpulse -= 0.0012 * dt;
        if (unlockImpulse < 0) unlockImpulse = 0;
      }

      ctx.fillStyle = colors.background;
      ctx.fillRect(0, 0, width, height);

      blobs.forEach(blob => blob.updateAndDraw(dt, colors, unlockImpulse));

      requestAnimationFrame(frame);
    }

    window.addEventListener('wallpaperEngineReady', (e) => {
      loadSettings();
      if (e.detail && e.detail.accentColors) {
        colors = { ...colors, ...e.detail.accentColors };
        document.body.style.backgroundColor = colors.background;
      }
    });

    window.addEventListener('wallpaperUpdate', (e) => {
      loadSettings();
      if (e.detail && e.detail.accentColors) {
        colors = { ...colors, ...e.detail.accentColors };
        document.body.style.backgroundColor = colors.background;
      }
    });

    window.addEventListener('wallpaperUnlock', () => { unlockImpulse = 1.0; });
    window.addEventListener('wallpaperPause', () => { isPaused = true; });
    window.addEventListener('wallpaperResume', () => {
      if (isPaused) {
        isPaused = false;
        lastTime = performance.now();
        requestAnimationFrame(frame);
      }
    });

    rebuildBlobs(3);
    requestAnimationFrame((now) => {
      lastTime = now;
      frame(now);
    });
  </script>
</body>
</html>
