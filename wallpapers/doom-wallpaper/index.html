<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doom Wallpaper</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none}#stage{position:fixed;inset:0;display:grid;place-items:center;background:#000}canvas{display:block;background:#000;image-rendering:auto}#stage.cover canvas,#stage.contain canvas{width:auto;height:auto}#stage.stretch canvas{width:100%;height:100%}button{display:none!important}#status{position:fixed;z-index:10;inset:0;display:grid;place-items:center;background:#000;color:#eee;font:16px system-ui;transition:opacity .35s}.ready{opacity:0;pointer-events:none}.load-box{text-align:center;width:min(76vw,320px)}#load-bar{height:6px;margin-top:14px;border-radius:9px;background:#3a3a3a;overflow:hidden}#load-progress{height:100%;width:0;background:#b11b1b;transition:width .15s}.controls{position:fixed;z-index:5;inset:0;pointer-events:none}.controls.hidden{display:none}.joystick{position:absolute;left:25px;bottom:29px;width:132px;height:132px;border:2px solid #ffffff66;border-radius:50%;background:#15151588;pointer-events:auto;touch-action:none}.stick{position:absolute;left:42px;top:42px;width:44px;height:44px;border-radius:50%;background:#e8e8e8aa;box-shadow:0 2px 8px #0008}#fps{position:fixed;z-index:8;top:12px;left:12px;border-radius:9px;padding:5px 8px;background:#000a;color:#fff;font:700 12px ui-monospace,monospace;pointer-events:none}.actions{position:absolute;right:20px;bottom:25px;display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:7px;pointer-events:auto}.key{display:grid;place-items:center;line-height:1;text-align:center;border:1px solid #ffffff77;border-radius:50%;background:#161616bb;color:#fff;font:800 15px system-ui;touch-action:none}.key:active{background:#b11b1bdd;transform:scale(.93)}.a{grid-column:3;grid-row:2;background:#a51414bb}.b{grid-column:2;grid-row:3}.x{grid-column:1;grid-row:2}.y{grid-column:2;grid-row:1}.options{grid-column:1;grid-row:3;border-radius:18px;font-size:11px}.menu{grid-column:3;grid-row:3;border-radius:18px;font-size:11px}
</style></head><body><div id="stage" class="cover"><canvas id="canvas" tabindex="-1"></canvas></div><div id="fps">0 FPS</div><div id="status"><div class="load-box"><div id="load-text">Подготовка DOOM…</div><div id="load-bar"><div id="load-progress"></div></div><small id="load-percent">0%</small></div></div><div class="controls" id="controls"><div id="joystick" class="joystick"><div id="stick" class="stick"></div></div><div class="actions"><div class="key y" data-key="Tab" role="button">Y</div><div class="key x" data-key="Shift" role="button">X</div><div class="key a" data-key="Control|Enter" role="button">A</div><div class="key b" data-key=" " role="button">B</div><div class="key options" data-key="Escape" role="button">OPTIONS</div><div class="key menu" data-key="Enter" role="button">MENU</div></div></div>
<script>
const canvas=document.getElementById('canvas'),stage=document.getElementById('stage'),controls=document.getElementById('controls'),status=document.getElementById('status'),loadText=document.getElementById('load-text'),loadProgress=document.getElementById('load-progress'),loadPercent=document.getElementById('load-percent'),joy=document.getElementById('joystick'),stick=document.getElementById('stick');
const fpsLabel=document.getElementById('fps');let fpsFrames=0,fpsLast=performance.now();function fpsTick(now){fpsFrames++;if(now-fpsLast>500){fpsLabel.textContent=Math.round(fpsFrames*1000/(now-fpsLast))+' FPS';fpsFrames=0;fpsLast=now}requestAnimationFrame(fpsTick)}requestAnimationFrame(fpsTick);
const engine=()=>window.WallpaperEngine;const get=(key,fallback)=>engine()?engine().getSetting(key,fallback):fallback;let pressed=new Set(),dependencyTotal=0,finishShown=false;
function codeFor(key){return key===' '?'Space':key==='Control'?'ControlLeft':key==='Shift'?'ShiftLeft':key}
function keyEvent(type,key){const codes={ArrowUp:38,ArrowDown:40,ArrowLeft:37,ArrowRight:39,Control:17,Shift:16,Tab:9,Escape:27,Enter:13,' ':32};canvas.focus();for(const target of [canvas,document,window]){const ev=new KeyboardEvent(type,{key,code:codeFor(key),bubbles:true,cancelable:true});for(const name of ['keyCode','which'])try{Object.defineProperty(ev,name,{value:codes[key]||0})}catch(_){};target.dispatchEvent(ev)}}
function hold(key,on){if(on&& !pressed.has(key)){pressed.add(key);keyEvent('keydown',key)}if(!on&&pressed.has(key)){pressed.delete(key);keyEvent('keyup',key)}}
function releaseAll(){[...pressed].forEach(k=>hold(k,false))}
function bindButton(button){const keys=button.dataset.key.split('|');button.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();button.setPointerCapture?.(e.pointerId);keys.forEach(key=>hold(key,true))});['pointerup','pointercancel','pointerleave'].forEach(type=>button.addEventListener(type,e=>{e.preventDefault();e.stopPropagation();keys.forEach(key=>hold(key,false))}))}document.querySelectorAll('[data-key]').forEach(bindButton);
let joyPointer=null;function moveStick(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=Math.max(-1,Math.min(1,(e.clientX-cx)/(r.width*.32))),dy=Math.max(-1,Math.min(1,(e.clientY-cy)/(r.height*.32)));stick.style.transform=`translate(${dx*38}px,${dy*38}px)`;const threshold=Math.max(.05,Math.min(.75,+get('joystickThreshold','.25')||.25));hold('ArrowLeft',dx<-threshold);hold('ArrowRight',dx>threshold);hold('ArrowUp',dy<-threshold);hold('ArrowDown',dy>threshold)}joy.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;joy.setPointerCapture?.(e.pointerId);moveStick(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)moveStick(e)});['pointerup','pointercancel'].forEach(type=>joy.addEventListener(type,e=>{if(e.pointerId===joyPointer){joyPointer=null;stick.style.transform='';releaseAll()}}));
function layoutCanvas(){const fit=get('fit','cover'),w=canvas.width||960,h=canvas.height||600,vw=innerWidth,vh=innerHeight;if(fit==='stretch'){canvas.style.width='100%';canvas.style.height='100%';return}const scale=(fit==='cover'?Math.max(vw/w,vh/h):Math.min(vw/w,vh/h));canvas.style.width=Math.ceil(w*scale)+'px';canvas.style.height=Math.ceil(h*scale)+'px'}function apply(){const fit=get('fit','cover'),show=get('controls','true')==='true',opacity=Math.max(15,Math.min(100,+get('controlsOpacity','65')||65)),filter=get('filter','smooth'),visual=get('visualFilter','none');stage.className=fit;controls.classList.toggle('hidden',!show);controls.style.opacity=opacity/100;controls.style.transform=`scale(${Math.max(.6,Math.min(1.6,+get('controlsSize','1')||1))})`;controls.style.transformOrigin='bottom center';canvas.style.imageRendering=filter==='pixel'?'pixelated':'auto';canvas.style.filter=visual==='contrast'?'contrast(1.25) saturate(1.15)':visual==='crt'?'contrast(1.18) saturate(.82) sepia(.08)':'none';layoutCanvas()}
function setStatus(text){const m=String(text||'').match(/(\d+)\s*\/\s*(\d+)/);if(m){const p=Math.round(+m[1]*100/+m[2]);loadText.textContent=text;loadProgress.style.width=p+'%';loadPercent.textContent=p+'%';return}if(text){loadText.textContent=text;return}if(finishShown)return;finishShown=true;loadText.textContent='Поклоняемся Некторизму';loadProgress.style.width='100%';loadPercent.textContent='100%';setTimeout(()=>{loadText.textContent='Готово';status.classList.add('ready')},300)}
window.Module={canvas,locateFile:(path)=>`game/${path}`,setStatus,monitorRunDependencies(left){dependencyTotal=Math.max(dependencyTotal,left);const p=dependencyTotal?Math.round((dependencyTotal-left)*100/dependencyTotal):0;loadText.textContent=left?'Загрузка файлов DOOM…':'Запуск игры…';loadProgress.style.width=p+'%';loadPercent.textContent=p+'%'}};
window.addEventListener('resize',layoutCanvas);new MutationObserver(records=>records.forEach(r=>r.addedNodes.forEach(n=>{if(n.nodeType===1&&n.matches?.('button:not(.key),input,select,textarea'))n.style.display='none'}))).observe(document.body,{childList:true,subtree:true});window.addEventListener('wallpaperEngineReady',apply);window.addEventListener('wallpaperUpdate',apply);window.addEventListener('wallpaperPause',releaseAll);window.addEventListener('wallpaperResume',apply);document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});apply();setTimeout(layoutCanvas,800);setTimeout(layoutCanvas,2500);
</script><script src="game/doom.js"></script></body></html>
