<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Material 3 Expressive Shapes — настройки</title>
<style>
  :root {
    --primary: #D0BCFF;
    --secondary: #CCC2DC;
    --tertiary: #EFB8C8;
    --surface: #1D192B;
    --background: #141218;
    --surface-container: #211F26;
    --on-surface: #E6E1E5;
    --on-surface-variant: #CAC4D0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--background);
    color: var(--on-surface);
    font-family: "Roboto", system-ui, -apple-system, sans-serif;
    transition: background 0.6s ease;
  }
  body { padding: 20px 16px 40px; }
  h1 { font-size: 22px; font-weight: 500; margin: 4px 0 2px; }
  .sub { font-size: 13px; color: var(--on-surface-variant); margin: 0 0 20px; }
  .card {
    background: var(--surface-container);
    border-radius: 24px;
    padding: 4px 18px;
    margin-bottom: 8px;
    transition: background 0.6s ease;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .row:last-child { border-bottom: none; }
  .row-label { font-size: 15px; }
  .row-sub { font-size: 12px; color: var(--on-surface-variant); margin-top: 2px; }

  .switch { position: relative; width: 48px; height: 28px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.16);
    border-radius: 999px;
    transition: background 0.2s ease;
    cursor: pointer;
  }
  .switch .thumb {
    position: absolute; top: 4px; left: 4px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--on-surface-variant);
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .switch input:checked + .track { background: var(--primary); }
  .switch input:checked + .track .thumb { transform: translateX(20px); background: #381E72; }

  /* -------- маскот: фиксируем в правом нижнем углу -------- */
  #robotWrap {
    position: fixed;
    bottom: -2px;
    right: 20px;
    z-index: 9999;
    pointer-events: none;
  }
  #robot { 
    width: 110px; 
    height: auto; 
    display: block; 
    overflow: visible; 
  }
  /* Плавная смена цвета для всех элементов робота при смене обоев */
  #robot path, #robot line, #robot circle {
    transition: fill 0.6s ease, stroke 0.6s ease;
  }
  /* Плавность движения зрачков + их перекраска */
  .pupil { 
    transition: transform 0.15s ease-out, fill 0.6s ease; 
  }
</style>
</head>
<body>

  <h1>Material 3 Expressive Shapes</h1>
  <p class="sub">Настройки обоев</p>

  <div class="card">
    <div class="row">
      <div>
        <div class="row-label">AMOLED-тема</div>
        <div class="row-sub">Чистый чёрный фон вместо цвета Material You (экономия заряда на AMOLED)</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="amoled">
        <span class="track"><span class="thumb"></span></span>
      </label>
    </div>

    <div class="row">
      <div>
        <div class="row-label">Отключить движение фигур</div>
        <div class="row-sub">Фигуры остаются на месте, без перемещения, вращения и столкновений</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="motion">
        <span class="track"><span class="thumb"></span></span>
      </label>
    </div>
  </div>

  <!-- Маскот красится в акцентные цвета -->
  <div id="robotWrap">
    <svg id="robot" viewBox="30 40 140 100" xmlns="http://www.w3.org/2000/svg">
      <!-- Антенны (основной акцент) -->
      <line x1="70" y1="88" x2="55" y2="55" stroke="var(--primary)" stroke-width="8" stroke-linecap="round"/>
      <line x1="130" y1="88" x2="145" y2="55" stroke="var(--primary)" stroke-width="8" stroke-linecap="round"/>

      <!-- Голова (основной акцент) -->
      <path d="M40,140 A60,60 0 0 1 160,140 Z" fill="var(--primary)"/>

      <!-- Подложка глаз (цвет фона страницы, чтобы была глубина) -->
      <circle cx="75" cy="115" r="11" fill="var(--background)"/>
      <circle cx="125" cy="115" r="11" fill="var(--background)"/>

      <!-- Зрачки (цвет текста, для контраста с подложкой) -->
      <circle class="pupil" id="pupilLeft" cx="75" cy="115" r="5" fill="var(--primary)"/>
      <circle class="pupil" id="pupilRight" cx="125" cy="115" r="5" fill="var(--primary)"/>
    </svg>
  </div>

  <script>
    // ---------- динамическая палитра от движка ----------
    const root = document.documentElement;

    function applyTheme(accentColors) {
      if (!accentColors) return;
      if (accentColors.background)       root.style.setProperty('--background', accentColors.background);
      if (accentColors.surfaceContainer) root.style.setProperty('--surface-container', accentColors.surfaceContainer);
      if (accentColors.surface)          root.style.setProperty('--surface', accentColors.surface);
      if (accentColors.primary)          root.style.setProperty('--primary', accentColors.primary);
      if (accentColors.secondary)        root.style.setProperty('--secondary', accentColors.secondary);
      if (accentColors.tertiary)         root.style.setProperty('--tertiary', accentColors.tertiary);
    }

    window.addEventListener('wallpaperUpdate', (e) => applyTheme(e.detail && e.detail.accentColors));
    window.addEventListener('wallpaperThemeChange', (e) => applyTheme(e.detail && e.detail.accentColors));
    window.addEventListener('wallpaperEngineReady', (e) => applyTheme(e.detail && e.detail.accentColors));

    // ---------- переключатели настроек ----------
    function wireSwitch(el, key, def) {
      const engine = window.WallpaperEngine;
      if (!engine || !el) return;
      el.checked = engine.getSetting(key, def ? 'true' : 'false') === 'true';
      el.addEventListener('change', () => {
        engine.saveSetting(key, el.checked ? 'true' : 'false');
      });
    }

    function bootSettings() {
      wireSwitch(document.getElementById('amoled'), 'amoledMode', false);
      wireSwitch(document.getElementById('motion'), 'disableMotion', false);
    }

    if (window.WallpaperEngine) bootSettings();
    window.addEventListener('wallpaperEngineReady', bootSettings);

    // ---------- маскот: глаза следят за курсором и возвращаются ----------
    const pupilLeft = document.getElementById('pupilLeft');
    const pupilRight = document.getElementById('pupilRight');
    const eyeR = 11, pupilR = 5;
    const maxOffset = eyeR - pupilR - 1; 
    let restTimeout;

    function eyeCenterInScreen(circleEl) {
      const svg = document.getElementById('robot');
      const rect = svg.getBoundingClientRect();
      const vb = svg.viewBox.baseVal;
      const scaleX = rect.width / vb.width;
      const scaleY = rect.height / vb.height;
      
      const cx = parseFloat(circleEl.getAttribute('cx'));
      const cy = parseFloat(circleEl.getAttribute('cy'));
      
      return {
        x: rect.left + (cx - vb.x) * scaleX,
        y: rect.top + (cy - vb.y) * scaleY,
        scale: (scaleX + scaleY) / 2
      };
    }

    function resetEyes() {
      pupilLeft.setAttribute('transform', `translate(0, 0)`);
      pupilRight.setAttribute('transform', `translate(0, 0)`);
    }

    function lookAt(px, py) {
      [pupilLeft, pupilRight].forEach((pupil) => {
        const eye = eyeCenterInScreen(pupil);
        let dx = px - eye.x;
        let dy = py - eye.y;
        
        const dist = Math.hypot(dx, dy) || 1;
        const clamped = Math.min(maxOffset, dist / (eye.scale || 1));
        
        const nx = (dx / dist) * clamped;
        const ny = (dy / dist) * clamped;
        pupil.setAttribute('transform', `translate(${nx}, ${ny})`);
      });

      clearTimeout(restTimeout);
      restTimeout = setTimeout(resetEyes, 1500);
    }

    document.addEventListener('mousemove', (e) => lookAt(e.clientX, e.clientY));
    
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) lookAt(e.touches[0].clientX, e.touches[0].clientY);
    });

    document.addEventListener('mouseleave', () => {
      clearTimeout(restTimeout);
      resetEyes();
    });
  </script>
</body>
</html>
