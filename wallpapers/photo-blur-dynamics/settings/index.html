<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки Photo Blur Dynamics</title>
    <style>
        :root {
            --accent-primary: #D0BCFF;
            --accent-secondary: #CCC2DC;
            --accent-tertiary: #EFB8C8;
            --accent-container: rgba(208, 188, 255, 0.15);
            --bg-color: #141218;
            --card-bg: rgba(255, 255, 255, 0.07);
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        h2 {
            color: var(--accent-primary);
            font-size: 20px;
            margin-top: 4px;
            margin-bottom: 16px;
            font-weight: bold;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }

        .card-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-desc {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 12px;
        }

        .preview-box {
            width: 100%;
            height: 140px;
            border-radius: 14px;
            background-size: cover;
            background-position: center;
            border: 2px dashed rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            overflow: hidden;
            position: relative;
        }

        .preview-box span {
            font-size: 13px;
            opacity: 0.6;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            background: var(--accent-primary);
            color: #141218;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.3s ease;
        }

        button.btn-secondary {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            flex: 0 0 auto;
            width: 44px;
        }

        button:active {
            opacity: 0.8;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-primary);
            margin-top: 8px;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Photo Blur Dynamics</h2>

        <!-- Фото рабочего стола -->
        <div class="card">
            <div class="card-title">
                <span>Рабочий стол</span>
            </div>
            <div class="card-desc">Выберите фоновое изображение для главного экрана</div>

            <div id="homePreview" class="preview-box">
                <span>Изображение не выбрано (Стандарт)</span>
            </div>

            <input type="file" id="homeFileInput" accept="image/*">

            <div class="btn-row">
                <button id="pickHomeBtn">Выбрать фото</button>
                <button id="clearHomeBtn" class="btn-secondary" title="Очистить">✕</button>
            </div>
        </div>

        <!-- Фото экрана блокировки -->
        <div class="card">
            <div class="card-title">
                <span>Экран блокировки</span>
            </div>
            <div class="card-desc">Выберите фоновое изображение для заблокированного экрана</div>

            <div id="lockPreview" class="preview-box">
                <span>Изображение не выбрано (Стандарт)</span>
            </div>

            <input type="file" id="lockFileInput" accept="image/*">

            <div class="btn-row">
                <button id="pickLockBtn">Выбрать фото</button>
                <button id="clearLockBtn" class="btn-secondary" title="Очистить">✕</button>
            </div>
        </div>

        <!-- Эффект размытия -->
        <div class="card">
            <div class="card-title">
                <span>Сила блюра блокировки</span>
                <span id="blurValText">16px</span>
            </div>
            <input type="range" id="blurSlider" min="0" max="35" value="16">
        </div>

        <!-- Скорость анимации -->
        <div class="card">
            <div class="card-title">
                <span>Скорость перехода</span>
                <span id="speedValText">0.6s</span>
            </div>
            <input type="range" id="speedSlider" min="0.2" max="1.5" step="0.1" value="0.6">
        </div>

        <button id="saveAllBtn" style="margin-top: 8px; padding: 14px; font-size: 15px;">Сохранить настройки</button>
    </div>

    <script>
        let homeImgPath = '';
        let lockImgPath = '';

        function formatImgUrl(urlStr) {
            if (!urlStr) return '';
            if (urlStr.startsWith('http://') || urlStr.startsWith('https://') || urlStr.startsWith('blob:') || urlStr.startsWith('data:')) {
                return urlStr;
            }
            return 'http://127.0.0.1:8088/' + urlStr.replace(/^\/+/, '');
        }

        function applyMonetColors(metadata) {
            if (metadata && metadata.accentColors) {
                const c = metadata.accentColors;
                const r = document.documentElement.style;
                if (c.primary) r.setProperty('--accent-primary', c.primary);
                if (c.secondary) r.setProperty('--accent-secondary', c.secondary);
                if (c.tertiary) r.setProperty('--accent-tertiary', c.tertiary);
                if (c.background) r.setProperty('--bg-color', c.background);
                if (c.surfaceContainer) r.setProperty('--card-bg', c.surfaceContainer);
            }
        }

        function updatePreviews() {
            const homePrev = document.getElementById('homePreview');
            const lockPrev = document.getElementById('lockPreview');

            const formattedHome = formatImgUrl(homeImgPath);
            const formattedLock = formatImgUrl(lockImgPath);

            if (formattedHome) {
                homePrev.style.backgroundImage = `url('${formattedHome}')`;
                homePrev.innerHTML = '';
            } else {
                homePrev.style.backgroundImage = '';
                homePrev.innerHTML = '<span>Изображение не выбрано (Стандарт)</span>';
            }

            if (formattedLock) {
                lockPrev.style.backgroundImage = `url('${formattedLock}')`;
                lockPrev.innerHTML = '';
            } else {
                lockPrev.style.backgroundImage = '';
                lockPrev.innerHTML = '<span>Изображение не выбрано (Стандарт)</span>';
            }
        }

        function loadValues() {
            if (window.WallpaperEngine && window.WallpaperEngine.getSetting) {
                applyMonetColors(window.WallpaperEngine.getMetadata());

                homeImgPath = window.WallpaperEngine.getSetting('homePhoto', '');
                lockImgPath = window.WallpaperEngine.getSetting('lockPhoto', '');
                const blurVal = window.WallpaperEngine.getSetting('blurAmount', '16');
                const speedVal = window.WallpaperEngine.getSetting('animSpeed', '0.6');

                document.getElementById('blurSlider').value = blurVal;
                document.getElementById('blurValText').textContent = blurVal + 'px';

                document.getElementById('speedSlider').value = speedVal;
                document.getElementById('speedValText').textContent = speedVal + 's';

                updatePreviews();
            }
        }

        window.addEventListener('wallpaperUpdate', (e) => {
            applyMonetColors(e.detail);
            loadValues();
        });

        window.addEventListener('wallpaperEngineReady', loadValues);

        document.addEventListener('DOMContentLoaded', () => {
            loadValues();
            setTimeout(loadValues, 100);

            document.getElementById('pickHomeBtn').addEventListener('click', () => {
                document.getElementById('homeFileInput').click();
            });

            document.getElementById('homeFileInput').addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        homeImgPath = event.target.result;
                        updatePreviews();
                    };
                    reader.readAsDataURL(file);
                }
            });

            document.getElementById('pickLockBtn').addEventListener('click', () => {
                document.getElementById('lockFileInput').click();
            });

            document.getElementById('lockFileInput').addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        lockImgPath = event.target.result;
                        updatePreviews();
                    };
                    reader.readAsDataURL(file);
                }
            });

            document.getElementById('clearHomeBtn').addEventListener('click', () => {
                homeImgPath = '';
                updatePreviews();
            });

            document.getElementById('clearLockBtn').addEventListener('click', () => {
                lockImgPath = '';
                updatePreviews();
            });

            document.getElementById('blurSlider').addEventListener('input', (e) => {
                document.getElementById('blurValText').textContent = e.target.value + 'px';
            });

            document.getElementById('speedSlider').addEventListener('input', (e) => {
                document.getElementById('speedValText').textContent = e.target.value + 's';
            });

            document.getElementById('saveAllBtn').addEventListener('click', () => {
                const blurVal = document.getElementById('blurSlider').value;
                const speedVal = document.getElementById('speedSlider').value;

                if (window.WallpaperEngine && window.WallpaperEngine.saveSetting) {
                    window.WallpaperEngine.saveSetting('homePhoto', homeImgPath);
                    window.WallpaperEngine.saveSetting('lockPhoto', lockImgPath);
                    window.WallpaperEngine.saveSetting('blurAmount', blurVal);
                    window.WallpaperEngine.saveSetting('animSpeed', speedVal);

                    showToast('Настройки фото-обоев сохранены!');
                }
            });
        });

        function showToast(msg) {
            let toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.background = 'var(--accent-primary)';
            toast.style.color = '#141218';
            toast.style.padding = '12px 24px';
            toast.style.borderRadius = '16px';
            toast.style.fontSize = '14px';
            toast.style.fontWeight = 'bold';
            toast.style.boxShadow = '0 4px 16px rgba(0,0,0,0.5)';
            toast.style.zIndex = '999999';
            toast.style.transition = 'opacity 0.3s ease';
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
    </script>
</body>
</html>
