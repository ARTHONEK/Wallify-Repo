<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topographic Wallpaper</title><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#000;display:block}canvas{position:fixed;inset:0}</style></head><body><canvas id="map"></canvas><script>
(()=>{'use strict';
const c=document.querySelector('#map'),x=c.getContext('2d',{alpha:false});let W,H,dpr,step,cols,rows,raf,last=0,paused=false,clock=0,reveal=1,quality=1,slowFrames=0,tx=0,ty=0,px=0,py=0;
let C={density:12,brightness:88,speed:.22,parallax:16,bg:'#000000',line:'#f7f7f7',mode:'flow',smooth:true,width:1.15,zoom:1,direction:'right',corners:48,bg2:'#101014',bgMode:'solid',nizm:false,levels:12};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)); const eng=()=>window.WallpaperEngine;
function read(){let e=eng();if(!e)return;C.density=clamp(+e.getSetting('density','12'),6,500);C.brightness=clamp(+e.getSetting('brightness','88'),20,500);C.parallax=clamp(+e.getSetting('parallax','16'),0,500);C.bg=e.getSetting('background','#000000');C.bg2=e.getSetting('backgroundSecondary','#101014');C.bgMode=e.getSetting('backgroundMode','solid');C.corners=clamp(+e.getSetting('cornerCount','48'),16,500);C.levels=clamp(+e.getSetting('density','12'),6,500);C.nizm=e.getSetting('nizm','false')==='true';C.line=e.getSetting('lineColor','#f7f7f7');C.mode=e.getSetting('motion','flow');C.direction=e.getSetting('direction','right');C.smooth=e.getSetting('curveStyle','smooth')==='smooth';C.width=clamp(+e.getSetting('lineWidth','1.15'),.65,50);C.zoom=clamp(+e.getSetting('zoom','100'),65,500)/100;C.speed=({verySlow:.045,slow:.09,normal:.18,fast:.34,veryFast:.55})[e.getSetting('animationSpeed','normal')]??.18;if(C.mode==='still')C.speed=0;}
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);// Bound the field resolution by screen area; high detail settings stay smooth without overwhelming the CPU.
    const minStep=Math.max(7,Math.sqrt((W*H)/4300)); step=clamp(Math.round(Math.max(Math.min(W,H)/C.corners,minStep)),7,22);cols=Math.ceil(W/step)+4;rows=Math.ceil(H/step)+4;}
function terrain(X,Y,t){let q=Math.max(W,H)/C.zoom,dir={right:[1,0],left:[-1,0],up:[0,-1],down:[0,1],downRight:[.72,.72],upLeft:[-.72,-.72]}[C.direction]||[1,0],drift=C.mode==='still'?0:t*.075,u=(X-W*.5-px)/q-drift*dir[0],v=(Y-H*.5-py)/q-drift*dir[1];let tide=C.mode==='tide'?t*2.2:t;let z=.15*Math.sin(u*5.2+tide*.31)+.115*Math.cos(v*7.4-tide*.25)+.08*Math.sin((u-v)*10.5+tide*.19);const a=[[ -.42,-.33,.88,.135],[ -.12,.28,.94,.17],[ .36,.15,1.02,.19],[ .42,-.38,.74,.14],[ -.56,.38,.64,.12],[ .58,.50,.78,.15]];for(let i=0;i<a.length;i++){let h=a[i],moving=C.mode!=='still',orbit=C.mode==='orbit',b=moving?Math.sin(t*(.42+i*.07)+i)*(orbit?.10:.065):0,dyShift=moving?Math.cos(t*(.35+i*.08)+i)*(orbit?.085:.045):0,dx=u-h[0]-b,dy=v-h[1]-dyShift;let life=C.mode==='breathe'?.48+.54*(.5+.5*Math.sin(t*.9+i*.55)):.78+.30*Math.sin(t*(.55+i*.05)+i);let amp=h[2]*life;z+=amp*Math.exp(-(dx*dx+dy*dy)/(h[3]*h[3]));}return z;}
const T=[[],[3,0],[0,1],[3,1],[1,2],[3,2,0,1],[0,2],[3,2],[2,3],[0,2],[0,3,1,2],[1,2],[1,3],[0,1],[3,0],[]];
function edgePoint(e,i,j,A,B,D,E,l){let p,q,ax=i*step,ay=j*step,bx=ax,by=ay;if(e===0){p=A;q=B;bx+=step}else if(e===1){p=B;q=D;ax+=step;bx+=step;by+=step}else if(e===2){p=E;q=D;ay+=step;by+=step;bx+=step}else{p=A;q=E;by+=step}let f=(l-p)/(q-p);return[ax+(bx-ax)*f,ay+(by-ay)*f];}
function key(e,i,j){return e===0?'h'+i+':'+j:e===1?'v'+(i+1)+':'+j:e===2?'h'+i+':'+(j+1):'v'+i+':'+j}
// Connects marching-square segments into complete paths, so a contour never looks like a set of broken dashes.
function contours(values,level){let seg=[],links=new Map();function add(k,id){let a=links.get(k);if(a)a.push(id);else links.set(k,[id])}for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){let A=values[j*(cols+1)+i],B=values[j*(cols+1)+i+1],D=values[(j+1)*(cols+1)+i+1],E=values[(j+1)*(cols+1)+i],code=(A>level?1:0)|(B>level?2:0)|(D>level?4:0)|(E>level?8:0),s=T[code];for(let n=0;n<s.length;n+=2){let a=s[n],b=s[n+1],id=seg.length;seg.push({a:key(a,i,j),b:key(b,i,j),p:edgePoint(a,i,j,A,B,D,E,level),q:edgePoint(b,i,j,A,B,D,E,level),used:false});add(key(a,i,j),id);add(key(b,i,j),id)}}
let paths=[];for(let id=0;id<seg.length;id++){if(seg[id].used)continue;let s=seg[id],path=[s.p,s.q];s.used=true;for(let side=0;side<2;side++){let k=side?s.a:s.b,at=side?0:path.length-1;while(true){let ids=links.get(k),next=ids&&ids.find(n=>!seg[n].used);if(next===undefined)break;let z=seg[next];z.used=true;let forward=z.a===k,k2=forward?z.b:z.a,p=forward?z.q:z.p;if(side)path.unshift(p);else path.push(p);k=k2;if(k===(side?s.b:s.a))break;}}paths.push(path)}return paths;}
function paintBackground(t){if(C.nizm){
      // Nectorizm: a vivid moving rainbow field with slow, coloured light rays.
      let hue=(t*9)%360, size=Math.hypot(W,H); x.fillStyle=`hsl(${hue},100%,9%)`;x.fillRect(0,0,W,H);x.save();x.globalCompositeOperation='lighter';
      for(let k=0;k<3;k++){let a=t*(.34+k*.055)+k*1.26,cx=W*(.5+.44*Math.cos(a)),cy=H*(.5+.42*Math.sin(a*1.17)),g=x.createRadialGradient(cx,cy,0,cx,cy,size*.58);g.addColorStop(0,`hsla(${(hue+k*116)%360},100%,61%,.72)`);g.addColorStop(.32,`hsla(${(hue+k*116+35)%360},100%,45%,.23)`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H)}
      x.globalAlpha=.38;for(let k=0;k<3;k++){x.save();x.translate(W*.5,H*.5);x.rotate(t*(.15+k*.025)+k*1.57);let ray=x.createLinearGradient(-size*.7,0,size*.7,0);ray.addColorStop(0,'rgba(0,0,0,0)');ray.addColorStop(.48,`hsla(${(hue+k*121)%360},100%,70%,.7)`);ray.addColorStop(.52,`hsla(${(hue+k*121+35)%360},100%,70%,.7)`);ray.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=ray;x.fillRect(-size*.7,-size*.12,size*1.4,size*.24);x.restore()}x.restore();return}if(C.bgMode==='solid'){x.fillStyle=C.bg;x.fillRect(0,0,W,H);return}if(C.bgMode==='gradient'){let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,C.bg);g.addColorStop(1,C.bg2);x.fillStyle=g;x.fillRect(0,0,W,H);return}x.fillStyle=C.bg;x.fillRect(0,0,W,H);let cx=W*(.5+.22*Math.sin(t*.36)),cy=H*(.45+.20*Math.cos(t*.29)),r=Math.max(W,H)*.82,g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,rgba(C.bg2,C.bgMode==='aurora'?.62:.88));g.addColorStop(1,rgba(C.bg2,0));x.fillStyle=g;x.fillRect(0,0,W,H)}
function rgba(hex,a){let r=parseInt(hex.slice(1,3),16)||0,g=parseInt(hex.slice(3,5),16)||0,b=parseInt(hex.slice(5,7),16)||0;return`rgba(${r},${g},${b},${a})`}
function render(now){if(paused)return;let raw=now-last;if(!last||raw>180){last=now;raw=16;slowFrames=0}let dt=Math.min(raw/1000,.04);last=now;if(dt>.035){slowFrames++;if(slowFrames>18)quality=Math.max(.68,quality-.015)}else{slowFrames=Math.max(0,slowFrames-2);if(!slowFrames)quality=Math.min(1,quality+.002)}clock+=dt*C.speed;reveal=Math.min(1,reveal+dt/1.15);px+=(tx-px)*Math.min(1,dt*3);py+=(ty-py)*Math.min(1,dt*3);paintBackground(clock);let V=new Float32Array((cols+1)*(rows+1));for(let j=0;j<=rows;j++)for(let i=0;i<=cols;i++)V[j*(cols+1)+i]=terrain((i-2)*step,(j-2)*step,clock);let lo=-.38,hi=1.16,baseLevels=Math.min(34,Math.round(6+Math.sqrt(C.levels-6)*1.45)),levelCount=Math.max(7,Math.round(baseLevels*quality));for(let n=0;n<levelCount;n++){let level=lo+(hi-lo)*(n+.5)/levelCount,major=n%4===1,paths=contours(V,level),pulse=.82+.18*Math.sin(clock*1.7+n*.73),brightnessBoost=C.brightness/100,alpha=Math.min(1,brightnessBoost*(major?.96:.43)*pulse*reveal);x.strokeStyle=C.nizm?`hsla(${(clock*26+n*360/levelCount)%360},100%,64%,${alpha})`:rgba(C.line,alpha);x.lineWidth=(major?1.7:1.05)*C.width*(1+Math.max(0,C.brightness-100)/300);x.lineCap='round';x.lineJoin='round';x.beginPath();for(const p of paths){if(p.length<2)continue;x.moveTo(p[0][0],p[0][1]);if(C.smooth&&p.length>2){for(let i=0;i<p.length-1;i++){let p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;x.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1])}}else for(let i=1;i<p.length;i++)x.lineTo(p[i][0],p[i][1]);}x.stroke();}raf=requestAnimationFrame(render)}
function start(){cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(render)}
function resetFrameClock(){last=performance.now();slowFrames=0}addEventListener('resize',()=>{resize();resetFrameClock();start()});addEventListener('wallpaperEngineReady',()=>{read();resize();reveal=0;resetFrameClock();start()});addEventListener('wallpaperUpdate',read);addEventListener('wallpaperPause',()=>{paused=true;cancelAnimationFrame(raf)});addEventListener('wallpaperResume',()=>{resetFrameClock();if(paused){paused=false;start()}});addEventListener('wallpaperScreenOn',resetFrameClock);document.addEventListener('visibilitychange',()=>{if(!document.hidden)resetFrameClock()});addEventListener('wallpaperGyroscope',e=>{tx=clamp(e.detail.roll/9.8,-1,1)*C.parallax;ty=clamp(e.detail.pitch/9.8,-1,1)*C.parallax});addEventListener('wallpaperOffset',e=>tx=(e.detail.xOffset-.5)*C.parallax*1.4);window.triggerAnimation=()=>{reveal=0};resize();start();
})();</script></body></html>
