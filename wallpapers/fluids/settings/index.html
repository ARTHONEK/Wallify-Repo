<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fluid Settings</title>
  <style>
    :root {
      /* Базовые значения (будут перезаписаны системой) */
      --bg: #141218;
      --surface: #211f26;
      --primary: #d0bcff;
      --on-surface: #e6e1e5;
      --on-surface-variant: #cac4d0;
      --outline: #938f96;
      --primary-container: #d0bcff;
      --on-primary-container: #381e72;
      --disabled: #49454f;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--on-surface);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      transition: background-color 0.3s ease;
    }

    .section {
      background: var(--surface);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .control-row.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .control-row:last-child { margin-bottom: 0; }

    label {
      font-size: 15px;
      color: var(--on-surface);
      flex: 1;
      padding-right: 8px;
    }

    .value-badge {
      font-size: 12px;
      background: var(--primary);
      color: var(--on-primary-container);
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: bold;
      min-width: 35px;
      text-align: center;
    }

    select {
      background: var(--bg);
      color: var(--on-surface);
      border: 1px solid var(--outline);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    .slider-container {
      display: flex;
      flex-direction: column;
      margin-bottom: 18px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      background: var(--outline);
      border-radius: 2px;
      appearance: none;
      outline: none;
      accent-color: var(--primary);
    }

    input[type="checkbox"] {
      appearance: none;
      width: 44px;
      height: 24px;
      background: var(--outline);
      border-radius: 20px;
      position: relative;
      transition: .3s;
      outline: none;
      cursor: pointer;
    }

    input[type="checkbox"]:checked {
      background: var(--primary);
    }

    input[type="checkbox"]::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: .3s;
    }

    input[type="checkbox"]:checked::before {
      left: 23px;
      background: var(--on-primary-container);
    }

    input[type="color"] {
      appearance: none;
      border: 2px solid var(--outline);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: none;
      cursor: pointer;
      padding: 0;
      overflow: hidden;
    }
    ::-webkit-color-swatch-wrapper { padding: 0; }
    ::-webkit-color-swatch { border: none; }

    .btn {
      background: var(--primary);
      color: var(--on-primary-container);
      border: none;
      padding: 14px 16px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 14px;
      width: 100%;
      margin-top: 10px;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }

    .file-info {
      font-size: 11px;
      color: var(--on-surface-variant);
      margin-top: 8px;
      text-align: center;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="section">
    <div class="section-title">Симуляция</div>
    <div class="control-row">
      <label for="quality">Качество отрисовки</label>
      <select id="quality">
        <option value="0">Высокое</option>
        <option value="1">Среднее</option>
        <option value="2">Низкое</option>
        <option value="3">Очень низкое</option>
      </select>
    </div>
    <div class="control-row">
      <label for="simResolution">Разрешение симуляции</label>
      <select id="simResolution">
        <option value="0">32</option>
        <option value="1">64</option>
        <option value="2">128</option>
        <option value="3">256</option>
      </select>
    </div>
    <div class="slider-container">
      <div class="slider-header"><label>Радиус всплеска</label><span class="value-badge" id="splatRadiusVal">20</span></div>
      <input type="range" id="splatRadius" min="1" max="100" value="20">
    </div>
    <div class="slider-container">
      <div class="slider-header"><label>Завихренность</label><span class="value-badge" id="vorticityVal">20</span></div>
      <input type="range" id="vorticity" min="0" max="50" value="20">
    </div>
    <div class="slider-container">
      <div class="slider-header"><label>Давление</label><span class="value-badge" id="pressureVal">10</span></div>
      <input type="range" id="pressure" min="0" max="100" value="10">
    </div>
  </div>

  <div class="section">
    <div class="section-title">Визуал</div>
    
    <div class="control-row">
      <label for="monetEnabled"><b>Цвета системы (Monet)</b></label>
      <input type="checkbox" id="monetEnabled">
    </div>

    <div class="control-row" id="colorfulRow">
      <label for="colorful">Разноцветный режим</label>
      <input type="checkbox" id="colorful">
    </div>

    <div class="control-row">
      <label for="shading">Тени (Shading)</label>
      <input type="checkbox" id="shading">
    </div>

    <div class="control-row">
      <label for="randomSplats">Случайные всплески</label>
      <input type="checkbox" id="randomSplats">
    </div>
  </div>

  <div class="section">
    <div class="section-title">Свечение</div>
    <div class="control-row">
      <label for="bloomEnable">Эффект Bloom</label>
      <input type="checkbox" id="bloomEnable">
    </div>
    <div class="slider-container">
      <div class="slider-header"><label>Интенсивность Bloom</label><span class="value-badge" id="bloomIntensityVal">15</span></div>
      <input type="range" id="bloomIntensity" min="10" max="200" value="15">
    </div>
    <div class="control-row">
      <label for="sunRaysEnable">Солнечные лучи</label>
      <input type="checkbox" id="sunRaysEnable">
    </div>
    <div class="slider-container">
      <div class="slider-header"><label>Яркость лучей</label><span class="value-badge" id="sunRaysWeightVal">40</span></div>
      <input type="range" id="sunRaysWeight" min="30" max="100" value="40">
    </div>
  </div>

  <div class="section">
    <div class="section-title">Задний план</div>
    <div class="control-row" id="bgColorRow">
      <label for="bgColor">Цвет фона</label>
      <input type="color" id="bgColor" value="#000000">
    </div>
    <div class="control-row">
      <label for="bgImgChk">Включить изображение</label>
      <input type="checkbox" id="bgImgChk">
    </div>
    <button class="btn" id="pickImg">Выбрать изображение</button>
    <div class="file-info" id="fileInfo">Стандартное изображение</div>
  </div>

  <script>
    const DEFAULTS = {
      quality: "0",
      simResolution: "2",
      splatRadius: "20",
      vorticity: "20",
      pressure: "10",
      monetEnabled: "false",
      colorful: "true",
      shading: "true",
      randomSplats: "false",
      bloomEnable: "true",
      bloomIntensity: "15",
      sunRaysEnable: "true",
      sunRaysWeight: "40",
      bgColor: "#000000",
      bgImgChk: "false",
      imgSelect: ""
    };

    // Функция применения цветов системы к интерфейсу настроек
    function applyMonetTheme(metadata) {
      if (!metadata || !metadata.accentColors) return;
      const colors = metadata.accentColors;
      const root = document.documentElement;

      root.style.setProperty('--bg', colors.background);
      root.style.setProperty('--surface', colors.surfaceContainer);
      root.style.setProperty('--primary', colors.primary);
      root.style.setProperty('--outline', colors.secondary);
      root.style.setProperty('--on-primary-container', colors.background); // Для контраста на кнопках

      if (metadata.theme === 'light') {
        root.style.setProperty('--on-surface', '#1c1b1f');
        root.style.setProperty('--on-surface-variant', '#49454f');
      } else {
        root.style.setProperty('--on-surface', '#e6e1e5');
        root.style.setProperty('--on-surface-variant', '#cac4d0');
      }
    }

    window.addEventListener('wallpaperEngineReady', (e) => {
      const engine = window.WallpaperEngine;
      
      // Применяем тему сразу
      applyMonetTheme(e.detail);

      function handleMonetLogic() {
        const isMonet = document.getElementById('monetEnabled').checked;
        const colorfulRow = document.getElementById('colorfulRow');
        const bgColorRow = document.getElementById('bgColorRow');
        
        if (isMonet) {
          colorfulRow.classList.add('disabled');
          bgColorRow.classList.add('disabled');
        } else {
          colorfulRow.classList.remove('disabled');
          bgColorRow.classList.remove('disabled');
        }
      }

      // --- ЧЕКБОКСЫ ---
      const checkboxes = [
        "monetEnabled", "colorful", "shading", 
        "randomSplats", "bloomEnable", "sunRaysEnable", "bgImgChk"
      ];
      
      checkboxes.forEach(id => {
        const el = document.getElementById(id);
        const val = engine.getSetting(id, DEFAULTS[id]);
        el.checked = (val === "true" || val === true);
        
        el.addEventListener('change', () => {
          engine.saveSetting(id, el.checked.toString());
          if (id === "monetEnabled") handleMonetLogic();
        });
      });

      // --- СЕЛЕКТЫ ---
      const dropdowns = ["quality", "simResolution"];
      dropdowns.forEach(id => {
        const el = document.getElementById(id);
        el.value = engine.getSetting(id, DEFAULTS[id]);
        el.addEventListener('change', () => engine.saveSetting(id, el.value));
      });

      // --- СЛАЙДЕРЫ ---
      const sliders = [
        "splatRadius", "vorticity", "pressure",
        "bloomIntensity", "sunRaysWeight"
      ];
      sliders.forEach(id => {
        const el = document.getElementById(id);
        const badge = document.getElementById(id + "Val");
        el.value = engine.getSetting(id, DEFAULTS[id]);
        if (badge) badge.textContent = el.value;

        el.addEventListener('input', () => {
          if (badge) badge.textContent = el.value;
          engine.saveSetting(id, el.value);
        });
      });

      // --- ЦВЕТ ---
      const colorInput = document.getElementById('bgColor');
      colorInput.value = engine.getSetting('bgColor', DEFAULTS.bgColor);
      colorInput.addEventListener('change', () => engine.saveSetting('bgColor', colorInput.value));

      // --- ВЫБОР ФАЙЛА ---
      const fileInfo = document.getElementById('fileInfo');
      fileInfo.textContent = engine.getSetting('imgSelect', 'Стандартное изображение');

      document.getElementById('pickImg').addEventListener('click', () => {
        engine.importFile('image/*');
      });

      handleMonetLogic();
    });

    // Слушаем обновления (смена темы или палитры системы)
    window.addEventListener('wallpaperUpdate', (e) => {
      applyMonetTheme(e.detail);
    });

    window.addEventListener('wallpaperFileImported', (e) => {
      const relativePath = e.detail.paths[0];
      document.getElementById('fileInfo').textContent = relativePath;
      window.WallpaperEngine.saveSetting('imgSelect', relativePath);
    });
  </script>
</body>
</html>
