<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft Wallpaper</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none;overscroll-behavior:none}#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#111}.hud{position:fixed;inset:0;z-index:3;pointer-events:none;font:700 13px system-ui;color:#fff;text-shadow:0 2px 2px #000}.status{position:absolute;inset:0;display:grid;place-items:center;background:#000;color:#fff;font:17px system-ui;transition:opacity .35s}.status.ready{opacity:0;pointer-events:none}.status small{display:block;text-align:center;color:#bbb;margin-top:9px}.fps{position:absolute;top:12px;left:12px;background:#0008;padding:5px 8px;border-radius:7px}.controls{position:absolute;inset:0;pointer-events:none}.controls.hidden{display:none}.lookpad{position:absolute;inset:0;pointer-events:auto;touch-action:none}.joy{position:absolute;z-index:2;bottom:28px;width:128px;height:128px;border:2px solid #ffffff70;border-radius:50%;background:#10101099;pointer-events:auto;touch-action:none}.move{left:23px}.look{right:23px}.nub{position:absolute;left:41px;top:41px;width:42px;height:42px;border-radius:50%;background:#eeeeeeaa;box-shadow:0 2px 8px #000}.actions{position:absolute;z-index:2;right:24px;bottom:176px;display:grid;grid-template-columns:repeat(2,60px);gap:9px;pointer-events:auto}.action{width:60px;height:60px;border-radius:50%;border:2px solid #fff9;background:#a51616cc;color:#fff;font:800 12px system-ui;display:grid;place-items:center;touch-action:none}.use{background:#347d37cc}.tip{position:absolute;top:12px;right:12px;background:#0008;padding:5px 8px;border-radius:7px}
</style></head><body><iframe id="game" src="game/eaglercraft.html" allow="autoplay; fullscreen; pointer-lock"></iframe><div class="hud"><div id="status" class="status"><div>Загрузка Eaglercraft 1.12.2…<small>Офлайн WebAssembly Minecraft</small></div></div><div id="fps" class="fps">0 FPS</div><div class="tip">Левый стик: ходьба · правый: поворот</div><div id="controls" class="controls"><div id="lookpad" class="lookpad"></div><div id="move" class="joy move"><div class="nub"></div></div><div class="actions"><div id="lm" class="action">LM</div><div id="rm" class="action use">RM</div><div id="jump" class="action">SPACE</div><div id="ekey" class="action use">E</div><div id="qkey" class="action">Q</div><div id="esc" class="action use">ESC</div></div></div></div><script>
(()=>{const frame=document.getElementById('game'),status=document.getElementById('status'),controls=document.getElementById('controls'),fps=document.getElementById('fps');const eng=()=>window.WallpaperEngine;const get=(k,d)=>eng()?eng().getSetting(k,d):d;let keys=new Set(),ready=false,frames=0,last=performance.now();
function target(){try{return frame.contentWindow.document.querySelector('canvas')||frame.contentWindow.document.body}catch(_){return null}}
function key(type,key){const codes={w:87,a:65,s:83,d:68,' ':32,Shift:16,Escape:27};for(const t of [target(),frame.contentWindow?.document,frame.contentWindow]){if(!t)continue;const e=new KeyboardEvent(type,{key,code:key===' '?'Space':key==='Shift'?'ShiftLeft':'Key'+key.toUpperCase(),bubbles:true,cancelable:true});for(const n of ['keyCode','which'])try{Object.defineProperty(e,n,{value:codes[key]||0})}catch(_){};t.dispatchEvent(e)}}
function hold(k,on){if(on&&!keys.has(k)){keys.add(k);key('keydown',k)}if(!on&&keys.has(k)){keys.delete(k);key('keyup',k)}}function release(){[...keys].forEach(k=>hold(k,false))}
function bindJoy(id,cb){const el=document.getElementById(id),nub=el.querySelector('.nub');let pointer=null;function move(e){const r=el.getBoundingClientRect(),x=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width*.34))),y=Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/(r.height*.34)));nub.style.transform=`translate(${x*38}px,${y*38}px)`;cb(x,y)}el.addEventListener('pointerdown',e=>{pointer=e.pointerId;el.setPointerCapture(e.pointerId);move(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===pointer)move(e)});['pointerup','pointercancel'].forEach(n=>el.addEventListener(n,e=>{if(e.pointerId===pointer){pointer=null;nub.style.transform='';cb(0,0)}}))}
function mouseButton(id,button){const e=document.getElementById(id),which=button===2?3:1;const send=type=>{const buttons=type==='mousedown'||type==='pointerdown'?(button===2?2:1):0;const c=target();if(c)c.focus?.();for(const t of [c,frame.contentWindow?.document,frame.contentWindow]){if(!t)continue;const m=new MouseEvent(type,{bubbles:true,cancelable:true,button,buttons,clientX:innerWidth*.5,clientY:innerHeight*.5});for(const n of ['which','detail'])try{Object.defineProperty(m,n,{value:n==='which'?which:1})}catch(_){};t.dispatchEvent(m)}};e.addEventListener('pointerdown',x=>{x.preventDefault();x.stopPropagation();send('mousedown')});['pointerup','pointercancel','pointerleave'].forEach(n=>e.addEventListener(n,x=>{x.preventDefault();x.stopPropagation();send('mouseup');if(n==='pointerup')send(button===2?'contextmenu':'click')}))}function clickKey(id,k){const e=document.getElementById(id);e.addEventListener('pointerdown',x=>{x.preventDefault();hold(k,true)});['pointerup','pointercancel','pointerleave'].forEach(n=>e.addEventListener(n,()=>hold(k,false)))}const lookpad=document.getElementById('lookpad');let lookPointer=null,lastX=0,lastY=0;lookpad.addEventListener('pointerdown',e=>{lookPointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;lookpad.setPointerCapture?.(e.pointerId)});lookpad.addEventListener('pointermove',e=>{if(e.pointerId!==lookPointer)return;const c=target(),dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;if(c&&(dx||dy)){const m=new MouseEvent('mousemove',{bubbles:true,clientX:e.clientX,clientY:e.clientY});try{Object.defineProperty(m,'movementX',{value:dx*1.4});Object.defineProperty(m,'movementY',{value:dy*1.4})}catch(_){};c.dispatchEvent(m)}});['pointerup','pointercancel'].forEach(n=>lookpad.addEventListener(n,e=>{if(e.pointerId===lookPointer)lookPointer=null}));bindJoy('move',(x,y)=>{const z=+get('moveDeadzone','.22')||.22;hold('a',x<-z);hold('d',x>z);hold('w',y<-z);hold('s',y>z)});mouseButton('lm',0);mouseButton('rm',2);clickKey('jump',' ');clickKey('ekey','e');clickKey('qkey','q');clickKey('esc','Escape');
function apply(){controls.classList.toggle('hidden',get('controls','true')!=='true');frame.style.filter=get('visual','normal')==='contrast'?'contrast(1.2) saturate(1.12)':get('visual','normal')==='soft'?'saturate(.86) brightness(.9)':'none'}function tick(t){frames++;if(t-last>500){fps.textContent=Math.round(frames*1000/(t-last))+' FPS';frames=0;last=t}requestAnimationFrame(tick)}frame.addEventListener('load',()=>{ready=true;status.classList.add('ready')});window.addEventListener('wallpaperEngineReady',apply);window.addEventListener('wallpaperUpdate',apply);window.addEventListener('wallpaperPause',release);window.addEventListener('wallpaperResume',apply);document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});apply();requestAnimationFrame(tick);requestAnimationFrame(mouseTick);
})();
</script></body></html>
