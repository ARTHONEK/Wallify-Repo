<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yui Material</title>
<style>
    :root{
        --bg: #141218;
        --shape-color: #211F26;
    }
    *{ box-sizing:border-box; }
    html, body{
        margin:0; padding:0;
        width:100%; height:100%;
        overflow:hidden;
        background: var(--bg);
    }

    #stage{
        position:fixed; inset:0;
        z-index:0;
        background: var(--bg);
    }

    #shapes{
        position:fixed; inset:0;
        z-index:1;
        width:100%; height:100%;
        display:block;
        pointer-events:none;
    }
    #shapes path{ fill: var(--shape-color); }

    #yui-wrap{
        position:fixed;
        z-index:2;
        left:50%;
        bottom:0;
        transform: translateX(-50%);
        width:100vw;
        max-width:900px;
        aspect-ratio: 3653 / 2267;
        overflow:visible;
        line-height:0;
        pointer-events:none;
    }
    #yui{
        display:block;
        width:100%;
        height:100%;
        object-fit:cover;
        object-position:center bottom;
        transform-origin:center center;
        will-change: transform;
        -webkit-user-drag:none;
        user-select:none;
    }
</style>
</head>
<body>
<div id="stage"></div>
<svg id="shapes" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="yui-wrap">
    <img id="yui" src="assets/yui.png" draggable="false" alt="">
</div>

<script>
(function(){
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById('shapes');
    const root = document.documentElement;

    function applyColors(meta){
        if(!meta || !meta.accentColors) return;
        const c = meta.accentColors;
        if(c.background)       root.style.setProperty('--bg', c.background);
        if(c.surfaceContainer) root.style.setProperty('--shape-color', c.surfaceContainer);
    }
    function pullMetadata(){
        if(!window.WallpaperEngine) return null;
        return window.WallpaperEngine.getMetadata();
    }

    const SHAPE_PATHS = {
        arrow:   "M262.422 104.907C253.213 90.2936 243.84 75.4777 231.389 63.8739C218.938 52.2412 202.808 44.023 186.27 45.0937C171.748 46.0486 158.288 54.0932 147.662 64.5974C137.036 75.1015 128.781 88.0365 120.661 100.856C98.7011 135.464 76.7136 170.073 54.7533 204.711C44.3181 221.147 33.6105 238.307 30.7224 257.898C27.2349 281.568 36.6348 305.673 53.3093 321.415C70.7467 337.88 99.0008 336.549 120.225 332.035C143.493 327.086 166.244 317.769 189.975 317.797C210.301 317.797 229.945 324.685 249.726 329.691C269.479 334.668 290.704 337.735 309.776 330.327C333.453 321.154 350.454 295.082 349.991 268.315C349.555 243.892 323.508 201.759 323.508 201.759C323.508 201.759 282.78 137.194 262.422 104.907Z",
        cookie4: "M230.389 50.473C293.109 23.2328 356.767 86.8908 329.527 149.611L325.023 159.981C316.707 179.13 316.707 200.87 325.023 220.019L329.527 230.389C356.767 293.109 293.109 356.767 230.389 329.527L220.019 325.023C200.87 316.707 179.13 316.707 159.981 325.023L149.611 329.527C86.8908 356.767 23.2328 293.109 50.473 230.389L54.9768 220.019C63.2934 200.87 63.2934 179.13 54.9768 159.981L50.473 149.611C23.2328 86.8908 86.8908 23.2328 149.611 50.473L159.981 54.9768C179.13 63.2934 200.87 63.2934 220.019 54.9768L230.389 50.473Z",
        circle:  "M350 190C350 278.366 278.366 350 190 350C101.634 350 30 278.366 30 190C30 101.634 101.634 30 190 30C278.366 30 350 101.634 350 190Z",
        triangle:"M136.461 98.2021C151.597 71.8217 159.165 58.6315 168.342 53.0594C181.648 44.9802 198.352 44.9802 211.658 53.0594C220.835 58.6315 228.403 71.8217 243.539 98.2021L325.309 240.72C340.3 266.847 347.795 279.911 347.993 290.585C348.28 306.06 339.949 320.418 326.364 327.864C316.994 333 301.919 333 271.77 333H108.23C78.0806 333 63.006 333 53.636 327.864C40.0505 320.418 31.7204 306.06 32.0072 290.585C32.2049 279.911 39.7003 266.847 54.6909 240.72L136.461 98.2021Z",
        pill:    "M116.116 71.7851C169.162 18.7383 255.168 18.7383 308.215 71.7851C361.262 124.832 361.262 210.838 308.215 263.884L263.884 308.215C210.838 361.262 124.832 361.262 71.7851 308.215C18.7383 255.168 18.7383 169.162 71.7851 116.116L116.116 71.7851Z"
    };
    const VIEWBOX = 380, LOCAL_CENTER = 190;
    const COLLISION_RATIO = 0.42;

    const MAX_OVERFLOW  = 0.4;    // фигуры уходят за края не более чем на 40% своего размера
    const ACCEL_BASE    = 26;     // px — максимальный сдвиг от наклона при весе 1.0
    const ACCEL_SMOOTH  = 0.15;   // сглаживание акселерометра
    const SPRING_K       = 34;    // жёсткость возврата к анкорной позиции после столкновения
    const SPRING_DAMP    = 8.5;   // затухание пружины (1/сек)
    const REST_DAMP_RATE = 2.0;   // доп. затухание скорости от столкновений (1/сек)
    const MAX_PHYS_OFFSET = 46;   // px — предохранитель от чрезмерного расталкивания

    const rand = (a,b) => a + Math.random()*(b-a);
    const clamp = (v,min,max) => Math.max(min, Math.min(max, v));

    let bodies = [];
    let sx = 0, sy = 0;       // сглаженные данные акселерометра (roll/pitch)
    let rafId = null, lastTime = 0, timeAcc = 0, isPaused = false;

    function pickCenter(w, h, vw, vh){
        const offX = w*MAX_OVERFLOW, offY = h*MAX_OVERFLOW;
        let minX = w/2 - offX, maxX = vw - w/2 + offX;
        let minY = h/2 - offY, maxY = vh - h/2 + offY;
        if(minX > maxX){ minX = maxX = vw/2; }
        if(minY > maxY){ minY = maxY = vh/2; }
        return [rand(minX,maxX), rand(minY,maxY)];
    }

    function buildShapes(){
        svg.innerHTML = '';
        const vw = window.innerWidth, vh = window.innerHeight;
        svg.setAttribute('viewBox', `0 0 ${vw} ${vh}`);

        const baseUnit = Math.min(vw, vh);
        // 5 разных размеров, тасуются между фигурами при каждой перестройке
        const sizeFactors = [0.16, 0.22, 0.30, 0.40, 0.52];
        for(let i=sizeFactors.length-1;i>0;i--){
            const j = Math.floor(Math.random()*(i+1));
            [sizeFactors[i], sizeFactors[j]] = [sizeFactors[j], sizeFactors[i]];
        }
        const refSize = baseUnit * 0.30; // средний размер — точка отсчёта для веса акселерометра

        const names = ['arrow','cookie4','circle','triangle','pill'];
        bodies = names.map((name, idx) => {
            const size = baseUnit * sizeFactors[idx];
            const [cx0, cy0] = pickCenter(size, size, vw, vh);
            const rot = name === 'circle' ? 0 : rand(-14, 14);

            const el = document.createElementNS(NS,'path');
            el.setAttribute('d', SHAPE_PATHS[name]);
            svg.appendChild(el);

            return {
                el, name, size, rot, cx0, cy0,
                radius: size*COLLISION_RATIO,
                // разная сила акселерометра: чем мельче фигура, тем сильнее её сдвигает
                accelWeight: clamp(refSize/size, 0.5, 2.2),
                // небольшой дрейф в простое — свой темп и фаза на каждую фигуру
                idleAmpX: rand(6,14), idleAmpY: rand(6,14),
                freqX: rand(0.15,0.30), freqY: rand(0.12,0.26),
                phaseX: rand(0,Math.PI*2), phaseY: rand(0,Math.PI*2),
                // смещение/скорость от столкновений
                px:0, py:0, pvx:0, pvy:0,
                cx:cx0, cy:cy0
            };
        });
    }

    function step(t){
        if(isPaused){ rafId=null; return; }
        if(!lastTime) lastTime = t;
        let dt = Math.min((t - lastTime)/1000, 0.08); // безопасный потолок даже на низких fps (раздел 11)
        lastTime = t;
        timeAcc += dt;

        const ax = clamp(sx/9.8,-1,1);
        const ay = clamp(sy/9.8,-1,1);

        bodies.forEach(b=>{
            const wobbleX = Math.sin(timeAcc*b.freqX + b.phaseX) * b.idleAmpX;
            const wobbleY = Math.cos(timeAcc*b.freqY + b.phaseY) * b.idleAmpY;
            b.driveX = b.cx0 + wobbleX + ax * ACCEL_BASE * b.accelWeight;
            b.driveY = b.cy0 + wobbleY + ay * ACCEL_BASE * b.accelWeight;
        });

        bodies.forEach(b=>{
            b.pvx += (-SPRING_K*b.px - SPRING_DAMP*b.pvx) * dt;
            b.pvy += (-SPRING_K*b.py - SPRING_DAMP*b.pvy) * dt;
            b.px += b.pvx*dt;
            b.py += b.pvy*dt;
            const decay = Math.exp(-REST_DAMP_RATE*dt);
            b.pvx *= decay; b.pvy *= decay;

            const mag = Math.hypot(b.px,b.py);
            if(mag > MAX_PHYS_OFFSET){ const s = MAX_PHYS_OFFSET/mag; b.px*=s; b.py*=s; }

            b.cx = b.driveX + b.px;
            b.cy = b.driveY + b.py;
        });

        for(let i=0;i<bodies.length;i++){
            for(let j=i+1;j<bodies.length;j++){
                const a = bodies[i], b = bodies[j];
                const dx = b.cx-a.cx, dy = b.cy-a.cy;
                const distSq = dx*dx+dy*dy;
                const minDist = a.radius+b.radius;
                if(distSq < minDist*minDist){
                    const dist = Math.max(Math.sqrt(distSq), 1);
                    const nx = dx/dist, ny = dy/dist;
                    const overlap = minDist-dist;

                    a.px -= nx*overlap/2; a.py -= ny*overlap/2;
                    b.px += nx*overlap/2; b.py += ny*overlap/2;

                    const rvx = b.pvx-a.pvx, rvy = b.pvy-a.pvy;
                    const vn = rvx*nx + rvy*ny;
                    if(vn < 0){
                        const restitution = 0.85;
                        const impulse = -(1+restitution)*vn;
                        const ix = impulse*nx/2, iy = impulse*ny/2;
                        a.pvx -= ix; a.pvy -= iy;
                        b.pvx += ix; b.pvy += iy;
                    }
                }
            }
        }

        bodies.forEach(b=>{
            const s = b.size/VIEWBOX;
            b.el.setAttribute('transform',
                `translate(${b.cx.toFixed(2)} ${b.cy.toFixed(2)}) rotate(${b.rot.toFixed(1)}) scale(${s.toFixed(4)}) translate(${-LOCAL_CENTER} ${-LOCAL_CENTER})`);
        });

        rafId = requestAnimationFrame(step);
    }

    function startLoop(){
        if(isPaused) return;
        if(!rafId){ lastTime = 0; rafId = requestAnimationFrame(step); }
    }

    window.addEventListener('wallpaperGyroscope', (e) => {
        sx += (e.detail.roll  - sx) * ACCEL_SMOOTH;
        sy += (e.detail.pitch - sy) * ACCEL_SMOOTH;
    });

    window.addEventListener('wallpaperPause', () => {
        isPaused = true;
        if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    });
    window.addEventListener('wallpaperResume', () => {
        isPaused = false;
        startLoop();
    });

    let resizeTimer = null;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { buildShapes(); startLoop(); }, 150);
    });

    window.addEventListener('wallpaperEngineReady', () => {
        applyColors(pullMetadata());
        buildShapes();
        startLoop();
    });
    window.addEventListener('wallpaperUpdate', (e) => applyColors(e.detail));

    window.addEventListener('load', () => {
        setTimeout(() => {
            if(!bodies.length){
                applyColors(pullMetadata());
                buildShapes();
                startLoop();
            }
        }, 150);
    });
})();
</script>

<script>
(function(){
    const wrap = document.getElementById('yui-wrap');
    const yui  = document.getElementById('yui');

    const ZOOM          = 1.10;  // зум ассета для параллакса
    const SMOOTHING      = 0.35; // 0..1: сглаживание гироскопа, меньше — плавнее, больше — отзывчивее
    const MARGIN_SAFETY  = 0.7;  // доля от доступного запаса (ZOOM-1)/2, оставляем буфер от края

    let sx = 0, sy = 0;          // сглаженные значения roll/pitch

    const clamp = (v,min,max) => Math.max(min, Math.min(max, v));

    function syncHeightFallback(){
        if(!wrap.clientWidth) return;
        wrap.style.height = (wrap.clientWidth * (2267/3653)) + 'px';
    }

    function render(){
        const w = wrap.clientWidth, h = wrap.clientHeight;
        const margin = ((ZOOM - 1) / 2) * MARGIN_SAFETY;
        const dx = clamp(sx / 9.8, -1, 1) * w * margin;
        const dy = clamp(sy / 9.8, -1, 1) * h * margin;
        yui.style.transform = `scale(${ZOOM}) translate3d(${dx.toFixed(2)}px, ${dy.toFixed(2)}px, 0)`;
    }

    // сглаживание данных акселерометра (гироскопа)
    window.addEventListener('wallpaperGyroscope', (e) => {
        sx += (e.detail.roll  - sx) * SMOOTHING;
        sy += (e.detail.pitch - sy) * SMOOTHING;
        render();
    });

    window.addEventListener('resize', () => { syncHeightFallback(); render(); });

    syncHeightFallback();
    render();
})();
</script>
</body>
</html>
